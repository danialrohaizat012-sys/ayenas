<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF8F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1110" media="(prefers-color-scheme: dark)">
<meta name="description" content="Order Ayenas — Pickup atau Delivery COD.">
<meta name="ayenas-build" content="v12-material3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ayenas">
<title>Ayenas — Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block" rel="stylesheet">
<style>
/* =========================================================
   AYENAS v12 — Material 3 (Flutter look & feel)
   Seed colour: Ayenas red #F20D12
   ========================================================= */
:root{
  --primary:#C0000C; --on-primary:#FFFFFF;
  --primary-container:#FFDAD5; --on-primary-container:#410001;
  --secondary:#775652; --secondary-container:#FFE08A; --on-secondary-container:#241A00;
  --tertiary:#705D00; --tertiary-container:#FFE170;
  --error:#BA1A1A; --error-container:#FFDAD6; --on-error-container:#410002;
  --success:#1E6B33; --success-container:#B6F2BE; --on-success-container:#00210B;
  --warn-container:#FFE08A; --on-warn-container:#3A2C00;
  --surface:#FFF8F6; --on-surface:#231918; --on-surface-variant:#534341;
  --surface-c-lowest:#FFFFFF; --surface-c-low:#FFF0EE; --surface-c:#FCEAE7;
  --surface-c-high:#F6E4E1; --surface-c-highest:#F1DEDB;
  --outline:#857370; --outline-variant:#D8C2BE;
  --inverse-surface:#392E2C; --inverse-on-surface:#FFEDEA; --inverse-primary:#FFB4A9;
  --scrim:rgba(0,0,0,.42);
  --elev1:0 1px 2px rgba(0,0,0,.18),0 1px 3px 1px rgba(0,0,0,.08);
  --elev2:0 1px 2px rgba(0,0,0,.18),0 2px 6px 2px rgba(0,0,0,.09);
  --elev3:0 4px 8px 3px rgba(0,0,0,.10),0 1px 3px rgba(0,0,0,.18);
  --ease:cubic-bezier(.2,0,0,1); --ease-dec:cubic-bezier(.05,.7,.1,1); --ease-acc:cubic-bezier(.3,0,.8,.15);
  --font:"Roboto Flex",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --primary:#FFB4A9; --on-primary:#690003;
    --primary-container:#930007; --on-primary-container:#FFDAD5;
    --secondary-container:#574400; --on-secondary-container:#FFE08A;
    --error:#FFB4AB; --error-container:#93000A; --on-error-container:#FFDAD6;
    --success:#9BD5A3; --success-container:#005320; --on-success-container:#B6F2BE;
    --warn-container:#574400; --on-warn-container:#FFE08A;
    --surface:#1A1110; --on-surface:#F1DEDB; --on-surface-variant:#D8C2BE;
    --surface-c-lowest:#140C0B; --surface-c-low:#231918; --surface-c:#271D1C;
    --surface-c-high:#322827; --surface-c-highest:#3D3231;
    --outline:#A08C89; --outline-variant:#534341;
    --inverse-surface:#F1DEDB; --inverse-on-surface:#392E2C; --inverse-primary:#C0000C;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--surface);color:var(--on-surface);-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button,input,textarea{font:inherit;color:inherit}
img{display:block}
.ms{font-family:"Material Symbols Rounded";font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:"liga";font-feature-settings:"liga";font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;user-select:none;flex:none}
.ms.fill{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
.ms.sm{font-size:20px}.ms.xs{font-size:18px}

/* Typography (M3 type scale) */
.display-s{font-size:36px;line-height:44px;font-weight:500;letter-spacing:-.25px}
.headline-m{font-size:28px;line-height:36px;font-weight:600}
.headline-s{font-size:24px;line-height:32px;font-weight:600}
.title-l{font-size:22px;line-height:28px;font-weight:600}
.title-m{font-size:16px;line-height:24px;font-weight:600;letter-spacing:.15px}
.title-s{font-size:14px;line-height:20px;font-weight:600;letter-spacing:.1px}
.body-l{font-size:16px;line-height:24px;letter-spacing:.3px}
.body-m{font-size:14px;line-height:20px;letter-spacing:.25px}
.body-s{font-size:12px;line-height:16px;letter-spacing:.4px}
.label-l{font-size:14px;line-height:20px;font-weight:600;letter-spacing:.1px}
.label-m{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.5px}
.label-s{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.5px}
.muted{color:var(--on-surface-variant)}

/* Shell */
#app{max-width:600px;margin:0 auto;min-height:100%;position:relative;background:var(--surface)}
@media (min-width:640px){body{background:var(--surface-c-low)} #app{box-shadow:var(--elev1)}}
.view{display:none;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.view.active{display:block;animation:fadeThrough .32s var(--ease-dec)}
@keyframes fadeThrough{from{opacity:0;transform:scale(.985) translateY(6px)}to{opacity:1;transform:none}}

/* Ripple (InkWell) */
.ink{position:relative;overflow:hidden;cursor:pointer;isolation:isolate}
.ink::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .2s;z-index:-1;pointer-events:none}
@media (hover:hover){.ink:hover::before{opacity:.08}}
.ink:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.14;transform:scale(0);animation:ripple .55s var(--ease) forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(1);opacity:0}}

/* Top app bar */
.appbar{position:sticky;top:0;z-index:20;background:var(--surface);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:8px;transition:background .25s,box-shadow .25s}
.appbar.scrolled{background:var(--surface-c)}
.appbar .title{flex:1;min-width:0}
.icon-btn{width:48px;height:48px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;color:var(--on-surface-variant);flex:none}
.icon-btn.tonal{background:var(--surface-c-high);color:var(--on-surface)}

/* Home header */
.brandrow{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 4px}
.brandrow .logo{width:44px;height:44px;border-radius:14px;object-fit:cover;box-shadow:var(--elev1)}
.outlet-pick{border:0;background:transparent;text-align:left;padding:4px 8px;margin-left:-8px;border-radius:12px;display:flex;flex-direction:column;min-width:0;flex:1}
.outlet-pick .row{display:flex;align-items:center;gap:2px;color:var(--on-surface)}
.outlet-pick .row span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.status-pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:8px;font-size:12px;font-weight:600}
.status-pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.status-pill.open{background:var(--success-container);color:var(--on-success-container)}
.status-pill.busy{background:var(--warn-container);color:var(--on-warn-container)}
.status-pill.closed{background:var(--error-container);color:var(--on-error-container)}

/* Segmented button */
.segmented{display:flex;border:1px solid var(--outline);border-radius:999px;overflow:hidden;height:48px}
.segmented button{flex:1;border:0;background:transparent;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;color:var(--on-surface);transition:background .2s var(--ease)}
.segmented button+button{border-left:1px solid var(--outline)}
.segmented button[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container)}
.segmented button .chk{display:none}
.segmented button[aria-pressed="true"] .chk{display:inline-block}
.segmented button[aria-pressed="true"] .ico{display:none}
.segmented button:disabled{opacity:.38}

/* Search bar */
.searchbar{display:flex;align-items:center;gap:12px;height:56px;border-radius:28px;background:var(--surface-c-high);padding:0 16px;color:var(--on-surface-variant)}
.searchbar input{flex:1;border:0;background:transparent;outline:none;font-size:16px;color:var(--on-surface);min-width:0}
.searchbar input::placeholder{color:var(--on-surface-variant)}

/* Hero */
.hero{margin:16px;border-radius:28px;overflow:hidden;position:relative;height:184px;background:#2a0b08}
.hero img{width:100%;height:100%;object-fit:cover;opacity:.72}
.hero .txt{position:absolute;inset:0;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.72))}
.hero .tag{align-self:flex-start;background:#FFC928;color:#241A00;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;letter-spacing:.5px;margin-bottom:8px}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;border-radius:8px;border:1px solid var(--outline-variant);background:transparent;padding:0 16px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--on-surface-variant);scroll-snap-align:start;transition:background .2s,border-color .2s}
.chip[aria-selected="true"]{background:var(--secondary-container);border-color:transparent;color:var(--on-secondary-container);padding-left:8px}
.chip .ms{display:none;font-size:18px}
.chip[aria-selected="true"] .ms{display:inline-block}
.sticky-chips{position:sticky;top:0;z-index:15;background:var(--surface);padding-top:calc(8px + env(safe-area-inset-top))}

.section-h{display:flex;align-items:baseline;justify-content:space-between;padding:12px 16px 8px}

/* Product cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 16px}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pcard{border:0;padding:0;text-align:left;background:var(--surface-c-low);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;color:var(--on-surface);box-shadow:var(--elev1);transition:box-shadow .2s,transform .15s var(--ease)}
.pcard:active{transform:scale(.98)}
.pcard .img{aspect-ratio:1/1;background:var(--surface-c-high);position:relative;overflow:hidden}
.pcard .img img{width:100%;height:100%;object-fit:cover;transition:transform .4s var(--ease)}
.pcard .badge{position:absolute;top:10px;left:10px;background:var(--primary);color:var(--on-primary);font-size:10px;font-weight:700;letter-spacing:.5px;padding:4px 8px;border-radius:8px}
.pcard .body{padding:12px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.pcard .name{font-size:14px;line-height:20px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.pcard .foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:4px}
.price{font-weight:700;color:var(--primary);font-size:16px}
.add-fab{width:40px;height:40px;border-radius:12px;border:0;background:var(--primary-container);color:var(--on-primary-container);display:grid;place-items:center;box-shadow:var(--elev1)}
.qty-mini{display:flex;align-items:center;gap:2px;background:var(--primary);color:var(--on-primary);border-radius:12px;height:40px;padding:0 2px}
.qty-mini button{width:36px;height:36px;border:0;background:transparent;color:inherit;display:grid;place-items:center;border-radius:10px}
.qty-mini b{min-width:18px;text-align:center;font-size:14px}
.pcard.soldout .img img{filter:grayscale(1) opacity(.55)}
.soldout-tag{position:absolute;inset:auto 10px 10px auto;background:var(--inverse-surface);color:var(--inverse-on-surface);font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px}

/* List tile */
.tile{display:flex;gap:16px;align-items:center;padding:12px 16px;min-height:56px}
.tile .lead{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--primary-container);color:var(--on-primary-container);flex:none}
.tile .mid{flex:1;min-width:0}
.divider{height:1px;background:var(--outline-variant);margin:0 16px}

/* Cards */
.card{background:var(--surface-c-low);border-radius:16px;margin:0 16px 12px;overflow:hidden}
.card.outlined{background:var(--surface);border:1px solid var(--outline-variant)}
.card.filled{background:var(--surface-c-highest)}
.card-pad{padding:16px}

/* Buttons */
.btn{height:40px;border:0;border-radius:20px;padding:0 24px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;letter-spacing:.1px;white-space:nowrap}
.btn.lg{height:56px;border-radius:28px;font-size:16px;padding:0 28px}
.btn.block{width:100%}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn.outlined{background:transparent;border:1px solid var(--outline);color:var(--primary)}
.btn.text{background:transparent;color:var(--primary);padding:0 12px}
.btn:disabled{background:color-mix(in srgb,var(--on-surface) 12%,transparent);color:color-mix(in srgb,var(--on-surface) 38%,transparent);box-shadow:none;border-color:transparent;cursor:not-allowed}
.btn.filled:not(:disabled){box-shadow:var(--elev1)}

/* Text field (outlined, floating label) */
.field{position:relative;margin:0 0 16px}
.field input,.field textarea{width:100%;border:1px solid var(--outline);border-radius:4px;background:transparent;padding:16px;font-size:16px;color:var(--on-surface);outline:none;transition:border-color .15s;resize:none}
.field textarea{min-height:88px}
.field label{position:absolute;left:12px;top:16px;padding:0 4px;background:var(--surface);color:var(--on-surface-variant);font-size:16px;pointer-events:none;transition:all .15s var(--ease);line-height:24px}
.card .field label{background:var(--surface-c-low)}
.field input:focus,.field textarea:focus{border:2px solid var(--primary);padding:15px}
.field input:focus+label,.field textarea:focus+label,.field input:not(:placeholder-shown)+label,.field textarea:not(:placeholder-shown)+label{top:-10px;font-size:12px;line-height:16px}
.field input:focus+label,.field textarea:focus+label{color:var(--primary)}
.field .support{font-size:12px;color:var(--on-surface-variant);padding:4px 16px 0}
.field.err input,.field.err textarea{border-color:var(--error)}
.field.err label,.field.err .support{color:var(--error)}
.field .prefix{position:absolute;left:16px;top:16px;font-size:16px;color:var(--on-surface-variant);line-height:24px}
.field.has-prefix input{padding-left:52px}
.field.has-prefix input:focus{padding-left:51px}

/* Navigation bar */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:600px;margin:0 auto;height:calc(80px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface-c);display:flex}
.navbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--on-surface-variant);font-size:12px;font-weight:600;letter-spacing:.5px}
.navbar .ind{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;position:relative;transition:background .25s var(--ease)}
.navbar button[aria-current="page"]{color:var(--on-surface)}
.navbar button[aria-current="page"] .ind{background:var(--secondary-container);color:var(--on-secondary-container)}
.navbar button[aria-current="page"] .ms{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
.nbadge{position:absolute;top:0;right:12px;min-width:16px;height:16px;border-radius:8px;background:var(--error);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.nbadge:empty,.nbadge[data-n="0"]{display:none}

/* Cart bar (extended FAB style) */
.cartbar{position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom));z-index:29;max-width:600px;margin:0 auto;padding:0 16px;pointer-events:none;transform:translateY(24px);opacity:0;transition:all .3s var(--ease-dec)}
.cartbar.show{transform:none;opacity:1}
.cartbar button{pointer-events:auto;width:100%;height:64px;border:0;border-radius:20px;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;gap:12px;padding:0 20px;box-shadow:var(--elev3);font-weight:600}
.cartbar .count{min-width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:14px}
.cartbar .grow{flex:1;text-align:left}

/* Bottom sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:600px;margin:0 auto;background:var(--surface-c-low);border-radius:28px 28px 0 0;max-height:92vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .36s var(--ease-dec);box-shadow:var(--elev3)}
.sheet.show{transform:none}
.sheet .handle{width:32px;height:4px;border-radius:2px;background:var(--outline);opacity:.5;margin:16px auto 8px;flex:none}
.sheet .scroll{overflow-y:auto;flex:1;overscroll-behavior:contain}
.sheet .actions{padding:12px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--outline-variant);display:flex;gap:12px;align-items:center;background:var(--surface-c-low)}
.sheet-img{margin:0 16px;border-radius:20px;overflow:hidden;aspect-ratio:16/11;background:var(--surface-c-high)}
.sheet-img img{width:100%;height:100%;object-fit:cover}

/* Checkbox list tile */
.check-tile{display:flex;align-items:center;gap:16px;padding:8px 16px 8px 8px;min-height:56px;border-radius:12px;margin:0 8px}
.check-tile input{position:absolute;opacity:0;pointer-events:none}
.cbox{width:18px;height:18px;border:2px solid var(--on-surface-variant);border-radius:2px;display:grid;place-items:center;margin:0 11px;flex:none;transition:all .15s}
.cbox .ms{font-size:16px;color:var(--on-primary);opacity:0;font-variation-settings:"FILL" 0,"wght" 700,"GRAD" 0,"opsz" 20}
.check-tile input:checked+.cbox{background:var(--primary);border-color:var(--primary)}
.check-tile input:checked+.cbox .ms{opacity:1}
.check-tile input:focus-visible+.cbox{outline:3px solid var(--primary);outline-offset:3px}

/* Stepper */
.stepper{display:flex;align-items:center;border:1px solid var(--outline);border-radius:20px;height:40px}
.stepper button{width:40px;height:38px;border:0;background:transparent;display:grid;place-items:center;color:var(--on-surface);border-radius:20px}
.stepper b{min-width:24px;text-align:center}

/* Radio cards */
.choice{display:flex;align-items:center;gap:16px;padding:16px;border-radius:16px;border:1px solid var(--outline-variant);margin:0 16px 8px;background:var(--surface)}
.choice[aria-checked="true"]{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,var(--surface))}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--on-surface-variant);display:grid;place-items:center;flex:none}
.choice[aria-checked="true"] .radio{border-color:var(--primary)}
.choice[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}

/* Cart lines */
.line{display:flex;gap:12px;padding:12px 16px;align-items:flex-start}
.line img{width:72px;height:72px;border-radius:14px;object-fit:cover;background:var(--surface-c-high);flex:none}
.line .mid{flex:1;min-width:0}
.sumrow{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.sumrow.total{font-size:18px;font-weight:700;padding-top:12px;margin-top:8px;border-top:1px dashed var(--outline-variant)}

/* Empty state */
.empty{text-align:center;padding:64px 32px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .art{width:120px;height:120px;border-radius:50%;background:var(--surface-c-high);display:grid;place-items:center;color:var(--primary);margin-bottom:8px}
.empty .art .ms{font-size:56px}

/* Tracking */
.track-hero{margin:8px 16px 16px;border-radius:28px;padding:24px;background:var(--primary-container);color:var(--on-primary-container);position:relative;overflow:hidden}
.track-hero.ready{background:var(--success-container);color:var(--on-success-container)}
.track-hero.cancelled{background:var(--error-container);color:var(--on-error-container)}
.track-hero .big{font-size:44px;line-height:52px;font-weight:700;letter-spacing:-.5px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.5px}
.live i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.vsteps{padding:8px 16px 8px 24px}
.vstep{display:flex;gap:16px;position:relative;padding-bottom:20px}
.vstep:last-child{padding-bottom:0}
.vstep::before{content:"";position:absolute;left:11px;top:26px;bottom:2px;width:2px;background:var(--outline-variant)}
.vstep:last-child::before{display:none}
.vstep.done::before{background:var(--primary)}
.vstep .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--outline-variant);display:grid;place-items:center;flex:none;background:var(--surface);z-index:1}
.vstep.done .dot{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.vstep.current .dot{border-color:var(--primary);box-shadow:0 0 0 6px color-mix(in srgb,var(--primary) 18%,transparent)}
.vstep.current .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}
.vstep .ms{font-size:16px}

.order-card{display:block;width:calc(100% - 32px);text-align:left;border:0;background:var(--surface-c-low);border-radius:16px;margin:0 16px 12px;padding:16px;color:var(--on-surface)}
.order-card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge-s{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.4px;background:var(--surface-c-highest);color:var(--on-surface-variant)}
.badge-s.new{background:var(--secondary-container);color:var(--on-secondary-container)}
.badge-s.preparing{background:var(--primary-container);color:var(--on-primary-container)}
.badge-s.ready,.badge-s.on-the-way{background:var(--success-container);color:var(--on-success-container)}
.badge-s.cancelled{background:var(--error-container);color:var(--on-error-container)}

/* Snackbar */
.snackbar{position:fixed;left:16px;right:16px;bottom:calc(168px + env(safe-area-inset-bottom));z-index:80;max-width:568px;margin:0 auto;background:var(--inverse-surface);color:var(--inverse-on-surface);border-radius:4px;min-height:48px;padding:14px 16px;font-size:14px;box-shadow:var(--elev3);display:flex;align-items:center;gap:12px;transform:translateY(16px);opacity:0;pointer-events:none;transition:all .25s var(--ease-dec)}
.snackbar.show{transform:none;opacity:1;pointer-events:auto}
.snackbar .act{margin-left:auto;background:none;border:0;color:var(--inverse-primary);font-weight:700;padding:0 4px}

/* Dialog */
.dialog{position:fixed;z-index:61;left:50%;top:50%;width:min(360px,calc(100% - 48px));transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none;background:var(--surface-c-high);border-radius:28px;padding:24px;transition:all .25s var(--ease-dec);box-shadow:var(--elev3)}
.dialog.show{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.dialog-scrim{z-index:60}

/* Outlet gate (full-screen) */
.gate{position:fixed;inset:0;z-index:70;background:var(--surface);overflow-y:auto;display:none;flex-direction:column}
.gate.show{display:flex;animation:fadeThrough .35s var(--ease-dec)}
.gate-inner{max-width:600px;width:100%;margin:0 auto;padding:calc(32px + env(safe-area-inset-top)) 16px 32px;display:flex;flex-direction:column;min-height:100%}
.gate-logo{width:72px;height:72px;border-radius:22px;box-shadow:var(--elev2);margin-bottom:24px}
.outlet-card{display:flex;gap:16px;align-items:center;border:0;width:100%;text-align:left;padding:16px;border-radius:20px;background:var(--surface-c-low);margin-bottom:12px;color:var(--on-surface)}
.outlet-card .pin{width:56px;height:56px;border-radius:16px;background:var(--primary-container);color:var(--on-primary-container);display:grid;place-items:center;flex:none}
.outlet-card[aria-checked="true"]{outline:2px solid var(--primary)}

/* Splash */
#splash{position:fixed;inset:0;z-index:100;background:#E30613;display:grid;place-items:center;transition:opacity .4s var(--ease),visibility .4s}
#splash.hide{opacity:0;visibility:hidden}
#splash img{width:96px;height:96px;border-radius:28px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .6s var(--ease-dec)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
#splash .bar{width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.3);margin:32px auto 0;overflow:hidden}
#splash .bar i{display:block;width:40%;height:100%;background:#fff;border-radius:2px;animation:load 1s infinite var(--ease)}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(250%)}}

/* Banner */
.banner{display:flex;gap:12px;align-items:flex-start;margin:0 16px 12px;padding:12px 16px;border-radius:12px;font-size:14px}
.banner.warn{background:var(--warn-container);color:var(--on-warn-container)}
.banner.err{background:var(--error-container);color:var(--on-error-container)}
.banner.info{background:var(--surface-c-high);color:var(--on-surface)}

.skeleton{background:linear-gradient(90deg,var(--surface-c-high) 0,var(--surface-c-highest) 40%,var(--surface-c-high) 80%);background-size:200% 100%;animation:shimmer 1.2s infinite linear}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.spin{width:20px;height:20px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

  return new Promise(res=>{
    const d=$('#dialog'), sc=$('#dialogScrim');
    d.innerHTML = `${icon?`<div style="text-align:center;color:var(--${danger?'error':'secondary'});margin-bottom:16px"><span class="ms" style="font-size:28px">${icon}</span></div>`:''}
      <div class="headline-s" style="${icon?'text-align:center':''}">${esc(title)}</div>
      ${body?`<div class="body-m muted" style="margin-top:16px">${body}</div>`:''}
      <div class="acts">${cancel?`<button class="btn text" data-r="0">${esc(cancel)}</button>`:''}<button class="btn text" data-r="1" ${danger?'style="color:var(--error)"':''}>${esc(confirm)}</button></div>`;
    const close=v=>{ d.classList.remove('show'); sc.classList.remove('show'); res(v); };
    d.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>close(b.dataset.r==='1'));
    sc.onclick=()=>close(false);
    sc.classList.add('show'); d.classList.add('show');
    d.querySelector('[data-r="1"]').focus();
  });
}

/* Bottom sheet */
let sheetOnClose=null;
function openSheet(html,onClose){
  const sh=$('#sheet'); sh.innerHTML = `<div class="handle"></div>`+html;
  $('#sheetScrim').classList.add('show'); sh.classList.add('show');
  sheetOnClose=onClose||null;
  document.body.style.overflow='hidden';
  enableSheetDrag(sh);
}
function closeSheet(){
  $('#sheet').classList.remove('show'); $('#sheetScrim').classList.remove('show');
  document.body.style.overflow='';
  if(sheetOnClose){ const f=sheetOnClose; sheetOnClose=null; f(); }
}
$('#sheetScrim').onclick=closeSheet;
function enableSheetDrag(sh){
  const h=sh.querySelector('.handle'); let y0=null, dy=0;
  const start=e=>{ y0=e.touches?e.touches[0].clientY:e.clientY; sh.style.transition='none'; };
  const move=e=>{ if(y0==null) return; dy=Math.max(0,(e.touches?e.touches[0].clientY:e.clientY)-y0); sh.style.transform=`translateY(${dy}px)`; };
  const end=()=>{ if(y0==null) return; sh.style.transition=''; sh.style.transform=''; if(dy>110) closeSheet(); y0=null; dy=0; };
  h.addEventListener('touchstart',start,{passive:true}); h.addEventListener('touchmove',move,{passive:true}); h.addEventListener('touchend',end);
  h.addEventListener('mousedown',start); window.addEventListener('mousemove',move); window.addEventListener('mouseup',end,{once:true});
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('#dialog').classList.contains('show')) $('#dialogScrim').click(); else if($('#sheet').classList.contains('show')) closeSheet(); }});

/* =========================================================
   ROUTER
   ========================================================= */
const VIEWS=['menu','cart','orders','track','profile'];
function go(view, opts={}){
  const [v,param] = view.split('/');
  if(!VIEWS.includes(v)) return go('menu');
  S.view=v; if(v==='track') S.trackId=param||S.trackId;
  const hash = '#/'+view;
  if(location.hash!==hash){ opts.replace ? history.replaceState(null,'',hash) : history.pushState(null,'',hash); }
  $$('.view').forEach(x=>x.classList.toggle('active', x.id==='view-'+v));
  $$('.navbar [data-nav]').forEach(b=>b.setAttribute('aria-current', b.dataset.nav===(v==='track'?'orders':v)?'page':'false'));
  window.scrollTo({top:0});
  render();
}
window.addEventListener('popstate',()=>{ closeSheet(); go(location.hash.replace(/^#\//,'')||'menu',{replace:true}); });
$$('.navbar [data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));
$$('[data-back]').forEach(b=>b.onclick=()=>history.length>1?history.back():go('orders'));
$('#cartbarBtn').onclick=()=>go('cart');

const onScroll=()=>{ const y=window.scrollY>4; $$('[data-scroll-elev]').forEach(a=>a.classList.toggle('scrolled',y)); $('#stickyChips').style.background = window.scrollY>260?'var(--surface-c)':''; };
window.addEventListener('scroll',onScroll,{passive:true});

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  renderChrome();
  if(S.view==='menu') renderMenu();
  if(S.view==='cart') renderCart();
  if(S.view==='orders') renderOrders();
  if(S.view==='track') renderTrack();
  if(S.view==='profile') renderProfile();
}

function renderChrome(){
  const n=cartCount();
  $('#navCartBadge').textContent=n||''; $('#navCartBadge').dataset.n=n;
  const act=S.orders.filter(isActiveOrder).length;
  $('#navOrderBadge').textContent=act||''; $('#navOrderBadge').dataset.n=act;
  $('#cbCount').textContent=n; $('#cbTotal').textContent=money(subtotal());
  $('#cartbar').classList.toggle('show', n>0 && S.view==='menu');

  const o=OUTLETS[S.outlet];
  $('#outletName').textContent = o ? o.short : 'Pilih outlet';
  const st=outletStatus(), pill=$('#outletStatus');
  pill.classList.toggle('hidden', !o);
  pill.className='status-pill '+st+(o?'':' hidden');
  const eta=num(setting().defaultEta);
  $('#outletStatusText').textContent = st==='closed'?'Tutup': st==='busy'?'Sibuk':(eta?`~${eta} min`:'Buka');

  // Mode switch
  $$('[data-mode-switch] button').forEach(b=>{
    b.setAttribute('aria-pressed', b.dataset.mode===S.mode);

  });
  if(S.mode==='delivery' && !deliveryEnabled()){ S.mode='pickup'; persist(); }
  $('#modeHint').textContent = S.mode==='pickup'
    ? `Ambil sendiri di ${o?o.short:'outlet'} · bayar di kaunter`
    : `Kami hantar ke lokasi anda · bayar tunai (COD) · caj ${money(deliveryFee()||DEFAULT_DELIVERY_FEE)}`;

  // Banner
  let b='';
  if(o && st==='closed') b=`<div class="banner err"><span class="ms sm">schedule</span><div><b>Outlet sedang tutup.</b><br>Anda boleh lihat menu, tapi order baru tidak diterima buat masa ini.</div></div>`;
  else if(o && st==='busy') b=`<div class="banner warn"><span class="ms sm">hourglass_top</span><div><b>Outlet agak sibuk.</b> ${eta?`Anggaran siap ~${eta} min.`:'Masa menunggu mungkin lebih lama.'}</div></div>`;
  const hs=o?hoursState(S.outlet):null;
  if(o && st!=='closed' && hs && !hs.open) b+=`<div class="banner info"><span class="ms sm">schedule</span><div><b>Di luar waktu operasi biasa.</b> ${esc(hs.text)}. Order mungkin diproses bila outlet dibuka.</div></div>`;
  $('#outletBanner').innerHTML=b;
}

/* ---------- Menu ---------- */
function visibleProducts(){
  const q=S.query.trim().toLowerCase();
  return S.products.filter(p=>p.active!==false)
    .filter(p=>!q || (p.name+' '+(p.desc||'')+' '+(p.category||'')+' '+(p.flavour||'')).toLowerCase().includes(q));
}
function categories(){ return ['Semua',...new Set(S.products.filter(p=>p.active!==false).map(p=>p.category||'Lain-lain'))]; }

function renderMenu(){
  const cats=categories(); if(!cats.includes(S.category)) S.category='Semua';
  $('#chips').innerHTML=cats.map(c=>`<button class="chip" role="tab" aria-selected="${c===S.category}" data-cat="${esc(c)}"><span class="ms">check</span>${esc(c)}</button>`).join('');
  $$('#chips [data-cat]').forEach(b=>b.onclick=()=>{ S.category=b.dataset.cat; renderMenu(); const top=$('#stickyChips').offsetTop; if(window.scrollY>top) window.scrollTo({top,behavior:'smooth'}); });

  const searching=!!S.query.trim();
  $('#hero').classList.toggle('hidden', searching);
  const best=S.products.find(p=>p.active!==false && /best/i.test(p.badge||'')) || S.products[0];
  if(best){ $('#heroImg').src=imgSrc(best); $('#heroTitle').textContent=best.name; $('#hero').onclick=()=>openProduct(best.id); $('#hero').style.cursor='pointer'; }

  let list=visibleProducts();
  if(S.category!=='Semua') list=list.filter(p=>(p.category||'Lain-lain')===S.category);
  const el=$('#menuSections');
  if(!list.length){
    el.innerHTML=`<div class="empty"><div class="art"><span class="ms">search_off</span></div><div class="title-l">Tiada menu dijumpai</div><div class="body-m muted">Cuba cari dengan perkataan lain.</div></div>`;
    return;
  }
  const groups={};
  list.forEach(p=>{ (groups[p.category||'Lain-lain'] ||= []).push(p); });
  el.innerHTML = Object.entries(groups).map(([cat,items])=>`
    <div class="section-h"><div class="title-l">${esc(cat)}</div><div class="label-m muted">${items.length} menu</div></div>
    <div class="grid">${items.map(productCard).join('')}</div>`).join('') + '<div style="height:24px"></div>';
  bindProductCards(el);
}
function productCard(p){
  const so=isSoldOut(p);
  const inCart=S.cart.filter(l=>l.id===p.id).reduce((s,l)=>s+l.qty,0);
  const simple=S.cart.find(l=>l.key===lineKey(p.id,[],''));
  return `<div class="pcard ${so?'soldout':''}" data-open="${esc(p.id)}" role="button" tabindex="0" aria-label="${esc(p.name)}, ${money(p.price)}">
    <div class="img"><img src="${esc(imgSrc(p))}" alt="" loading="lazy" onerror="this.src='nasi.jpg'">
      ${p.badge&&!so?`<span class="badge">${esc(p.badge)}</span>`:''}${so?'<span class="soldout-tag">Habis</span>':''}</div>
    <div class="body">
      <div class="name">${esc(p.name)}</div>
      <div class="foot">
        <span class="price">${money(p.price)}</span>
        ${so?'' : (simple && inCart===simple.qty
          ? `<div class="qty-mini" data-stop><button data-dec="${esc(p.id)}" aria-label="Kurang"><span class="ms sm">remove</span></button><b>${simple.qty}</b><button data-inc="${esc(p.id)}" aria-label="Tambah"><span class="ms sm">add</span></button></div>`
          : `<button class="add-fab" data-quick="${esc(p.id)}" aria-label="Tambah ${esc(p.name)}">${inCart?`<b>${inCart}</b>`:'<span class="ms">add</span>'}</button>`)}
      </div>
    </div></div>`;
}
function bindProductCards(root){
  root.querySelectorAll('[data-open]').forEach(c=>{
    c.onclick=e=>{ if(e.target.closest('[data-quick],[data-stop]')) return; openProduct(c.dataset.open); };
    c.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openProduct(c.dataset.open);} };
  });
  root.querySelectorAll('[data-quick]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); quickAdd(b.dataset.quick); });
  root.querySelectorAll('[data-inc]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); quickAdd(b.dataset.inc); });
  root.querySelectorAll('[data-dec]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const l=S.cart.find(x=>x.key===lineKey(b.dataset.dec,[],'')); if(l) changeQty(l.key,-1); });
}

let searchT;
$('#search').addEventListener('input',e=>{ clearTimeout(searchT); searchT=setTimeout(()=>{ S.query=e.target.value; $('#searchClear').classList.toggle('hidden',!S.query); renderMenu(); },120); });

      <div style="padding:20px 24px 8px">

      ${addons.map(a=>`<label class="check-tile ink"><input type="checkbox" value="${esc(a.id)}"><span class="cbox"><span class="ms">check</span></span><span class="body-l" style="flex:1">${esc(a.name)}</span><span class="body-m muted">+${money(a.price)}</span></label>`).join('')}`:''}
      ${so?'':`<div style="padding:16px 16px 8px"><div class="field"><textarea id="pNote" placeholder=" " maxlength="140" rows="2"></textarea><label for="pNote">Nota untuk dapur</label><div class="support">Contoh: kurang pedas, sos asing</div></div></div>`}
    </div>
    <div class="actions">
      ${so?`<button class="btn tonal lg block" onclick="window.__closeSheet()">Tutup</button>`:`
      <div class="stepper"><button id="qDec" aria-label="Kurang"><span class="ms">remove</span></button><b id="qVal">1</b><button id="qInc" aria-label="Tambah"><span class="ms">add</span></button></div>
      <button class="btn filled lg" id="addBtn" style="flex:1">Tambah · <span id="addTotal">${money(p.price)}</span></button>`}
    </div>`);
  if(so) return;
  const sh=$('#sheet');
  const upd=()=>{ const ex=addons.filter(a=>chosen.has(a.id)).reduce((s,a)=>s+a.price,0); sh.querySelector('#qVal').textContent=qty; sh.querySelector('#addTotal').textContent=money((num(p.price)+ex)*qty); sh.querySelector('#qDec').disabled=qty<=1; };
  sh.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{ c.checked?chosen.add(c.value):chosen.delete(c.value); vibrate(5); upd(); });
  sh.querySelector('#qDec').onclick=()=>{ if(qty>1){qty--;upd();} };
  sh.querySelector('#qInc').onclick=()=>{ if(qty<20){qty++;upd();} };
  sh.querySelector('#addBtn').onclick=()=>{
    const list=addons.filter(a=>chosen.has(a.id));
    addToCart(p,qty,list,sh.querySelector('#pNote').value.trim());
    closeSheet();
  };
  upd();
}

/* ---------- Cart ops ---------- */
function addToCart(p,qty,addonList,note){
  if(isSoldOut(p)) return snack('Menu ini sudah habis.');
  const key=lineKey(p.id,addonList.map(a=>a.id),note);
  const ex=S.cart.find(l=>l.key===key);
  if(ex) ex.qty=Math.min(50,ex.qty+qty);
  else S.cart.push({ key, id:p.id, name:p.name, price:num(p.price), category:p.category||'', imageUrl:imgSrc(p).startsWith('data:')?'':imgSrc(p),
    qty, extras:addonList.reduce((s,a)=>s+a.price,0), extrasList:addonList.map(a=>a.name), note });
  persist(); vibrate(12); render();
  snack(`${p.name} ditambah ke troli`, {label:'LIHAT', fn:()=>go('cart')});
}
function quickAdd(id){
  const p=S.products.find(x=>x.id===id); if(!p) return;
  addToCart(p,1,[],'');
}
function changeQty(key,d){
  const l=S.cart.find(x=>x.key===key); if(!l) return;
  l.qty+=d;
  if(l.qty<=0){
    const idx=S.cart.indexOf(l), removed={...l,qty:1}; S.cart.splice(idx,1);
    snack(`${l.name} dibuang`, {label:'UNDO', fn:()=>{ S.cart.splice(idx,0,removed); persist(); render(); }});
  }
  persist(); vibrate(6); render();
}
function cartImg(l){ const p=S.products.find(x=>x.id===l.id); return imgSrc(p||l); }

      </button>
      <p class="body-s muted" style="text-align:center;margin:12px 0 0">Dengan menghantar order, anda bersetuju untuk ${isDel?'membayar tunai kepada rider':'mengambil & membayar di outlet'}.</p>
    </div>`;

  el.querySelectorAll('[data-mode-switch] button').forEach(b=>b.onclick=()=>{ saveForm(); setMode(b.dataset.mode); });

}
$('#clearCartBtn').onclick=async()=>{ if(await dialog({icon:'delete',title:'Kosongkan troli?',body:'Semua item dalam troli akan dibuang.',confirm:'Kosongkan',cancel:'Batal',danger:true})){ S.cart=[]; persist(); render(); } };

function saveForm(){
  const v=id=>document.getElementById(id)?.value;
  if(v('cName')!=null) S.profile.name=v('cName').trim();
  if(v('cPhone')!=null) S.profile.phone=v('cPhone').trim();

  if(v('cAddrNote')!=null) S.profile.addressNote=v('cAddrNote').trim();

}

function pinLocation(){
  if(!navigator.geolocation) return snack('Peranti ini tidak menyokong lokasi.');
  saveForm();
  $('#pinText').textContent='Mencari lokasi…';
  navigator.geolocation.getCurrentPosition(
    p=>{ S.location={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),accuracy:p.coords.accuracy}; vibrate(15); renderCart(); snack('Lokasi berjaya dipin'); },
    e=>{ $('#pinText').textContent= e.code===1?'Akses lokasi ditolak. Benarkan di tetapan browser.':'Gagal dapatkan lokasi. Cuba lagi.'; },
    {enableHighAccuracy:true,timeout:15000,maximumAge:60000});
}

function fieldErr(id,msg){
  const f=document.getElementById(id); if(!f) return;
  f.classList.add('err');
  let s=f.querySelector('.support'); if(!s){ s=document.createElement('div'); s.className='support'; f.appendChild(s); }
  s.dataset.orig ??= s.textContent; s.textContent=msg;
  f.querySelector('input,textarea')?.addEventListener('input',()=>{ f.classList.remove('err'); s.textContent=s.dataset.orig; },{once:true});
}

async function placeOrder(){
  if(S.placing) return;
  saveForm();
  const P=S.profile, isDel=S.mode==='delivery';
  let firstErr=null;
  if(P.name.length<2){ fieldErr('fName','Masukkan nama anda'); firstErr??='cName'; }
  if(!validPhone(P.phone)){ fieldErr('fPhone','Nombor tidak sah. Contoh: 0123456789'); firstErr??='cPhone'; }
  if(isDel && P.address.length<10){ fieldErr('fAddr','Masukkan alamat yang lengkap'); firstErr??='cAddr'; }
  if(firstErr){ const i=document.getElementById(firstErr); i.scrollIntoView({behavior:'smooth',block:'center'}); i.focus({preventScroll:true}); vibrate([20,40,20]); return; }
  if(!S.outlet) return showGate(true);
  if(outletStatus()==='closed') return snack('Outlet sedang tutup.');
  const so=S.cart.filter(l=>{ const p=S.products.find(x=>x.id===l.id); return !p || p.active===false || isSoldOut(p); });
  if(so.length) return dialog({icon:'error',title:'Ada item tidak tersedia',body:`${so.map(l=>esc(l.name)).join(', ')} tidak tersedia di outlet ini. Sila buang dari troli.`});
  if(!S.fb) return snack('Tiada sambungan ke server. Semak internet dan cuba lagi.');

  const o=OUTLETS[S.outlet], sub=subtotal(), fee=deliveryFee(), total=Math.round((sub+fee)*100)/100;
  const ok=await dialog({
    icon: isDel?'two_wheeler':'storefront',
    title: 'Sahkan order?',
    body: `<div style="display:grid;gap:6px">
      <div><b>${isDel?'Delivery COD':'Pickup'}</b> · ${esc(o.short)}</div>
      <div>${cartCount()} item · <b>${money(total)}</b></div>
      <div>${isDel?'Bayar tunai kepada rider.':'Bayar di kaunter semasa ambil.'}</div></div>`,
    confirm:'Hantar', cancel:'Semak semula'
  });
  if(!ok) return;

  S.placing=true; renderCart();
  const phone=normPhone(P.phone);
  const order = {
    id: 'AY'+Date.now().toString().slice(-7),
    created: new Date().toISOString(),
    name: P.name, phone,
    mode: S.mode, orderType: S.mode,
    outlet: S.outlet, outletId: S.outlet,
    items: S.cart.map(l=>({ id:l.id, name:l.name, price:l.price, qty:l.qty, extras:l.extras, extrasList:l.extrasList||[], note:l.note||'', category:l.category||'', imageUrl:l.imageUrl||'' })),
    itemCount: cartCount(),
    subtotal: Math.round(sub*100)/100,
    deliveryFee: fee,
    total,
    status:'new', orderStatus:'new',
    etaMinutes: num(setting().defaultEta),
    paymentMethod: isDel?'cod':'counter',
    paymentStatus:'unpaid',
    deliveryAddress: isDel?P.address:null,
    deliveryNote: isDel?(P.addressNote||''):null,
    deliveryContact: isDel?phone:null,
    deliveryLocation: isDel&&S.location?{lat:S.location.lat,lng:S.location.lng}:null,
    source:'web-v12'
  };
  try{
    const ref=await S.fb.createOrder(order);
    order.firestoreId=ref.id;
  }catch(err){
    console.error(err); S.placing=false; renderCart();
    return dialog({icon:'wifi_off',title:'Order gagal dihantar',body:'Sila semak sambungan internet anda dan cuba lagi. Troli anda masih disimpan.',confirm:'OK'});
  }
  S.placing=false;
  S.orders=[order,...S.orders.filter(x=>x.firestoreId!==order.firestoreId)];
  store.set('ay_orders',S.orders.slice(0,30));
  S.cart=[]; persist(); vibrate([30,60,30]);
  go('track/'+order.firestoreId);
  snack('Order berjaya dihantar!');
}

  el.innerHTML = (active.length?`<div class="section-h"><div class="title-m">Sedang berjalan</div></div>${active.map(card).join('')}`:'')
    + (past.length?`<div class="section-h"><div class="title-m">Sejarah</div></div>${past.slice(0,20).map(card).join('')}`:'');
  el.querySelectorAll('[data-track]').forEach(b=>b.onclick=e=>{

    if(b.dataset.track) go('track/'+b.dataset.track);
  });

function reorder(id){
  const o=S.orders.find(x=>(x.firestoreId||x.id)===id); if(!o) return;
  let added=0, skipped=[];
  (o.items||[]).forEach(i=>{
    const p=S.products.find(x=>x.id===i.id);
    if(!p||p.active===false||isSoldOut(p)){ skipped.push(i.name); return; }
    const al=addonsFor(p).filter(a=>(i.extrasList||[]).includes(a.name));
    const key=lineKey(p.id,al.map(a=>a.id),i.note||'');
    const ex=S.cart.find(l=>l.key===key);
    if(ex) ex.qty+=num(i.qty)||1;
    else S.cart.push({key,id:p.id,name:p.name,price:num(p.price),category:p.category||'',imageUrl:imgSrc(p).startsWith('data:')?'':imgSrc(p),qty:num(i.qty)||1,extras:al.reduce((s,a)=>s+a.price,0),extrasList:al.map(a=>a.name),note:i.note||''});
    added++;
  });
  persist();
  if(added){ go('cart'); snack(skipped.length?`${skipped.length} item tidak tersedia dilangkau`:'Item ditambah ke troli'); }
  else snack('Item dalam order ini tidak tersedia sekarang.');
}

/* =========================================================
   FIREBASE (backend)
   ========================================================= */
(async()=>{
  try{
    const [{initializeApp},{getAuth,signInAnonymously,onAuthStateChanged},fs] = await Promise.all([
      import(FB+'firebase-app.js'), import(FB+'firebase-auth.js'), import(FB+'firebase-firestore.js')
    ]);
    const {getFirestore,collection,doc,setDoc,addDoc,onSnapshot,query,where,serverTimestamp,increment}=fs;
    const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
    const ensureUser=async()=>auth.currentUser||(await signInAnonymously(auth)).user;

    S.fb={
      async createOrder(order){
        const user=await ensureUser();
        const ref=await addDoc(collection(db,'orders'),{...order,customerUid:user.uid,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
        setDoc(doc(db,'customers',user.uid),{
          name:order.name, phone:order.phone, phoneDigits:order.phone.replace(/\D/g,''),
          lastOutletId:order.outletId, lastOrderType:order.orderType,
          ...(order.deliveryAddress?{lastAddress:order.deliveryAddress}:{}),
          lastOrderAt:serverTimestamp(), updatedAt:serverTimestamp(),
          orderCount:increment(1), totalSpend:increment(Number(order.total||0))
        },{merge:true}).catch(e=>console.warn('customer profile',e));
        return ref;
      }
    };

    onSnapshot(collection(db,'products'),snap=>{
      if(snap.empty) return;
      S.products=snap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.active!==false)
        .sort((a,b)=>(num(a.sort)-num(b.sort)) || 0);
      S.menuLive=true;
      // Selaraskan harga troli dengan harga live
      S.cart.forEach(l=>{ const p=S.products.find(x=>x.id===l.id); if(p){ l.price=num(p.price); l.name=p.name; } });
      persist(); render();
    },e=>console.warn('menu',e));

    onSnapshot(collection(db,'outletSettings'),snap=>{
      S.settings={}; snap.docs.forEach(d=>S.settings[d.id]=d.data());
      render(); if($('#gate').classList.contains('show')) showGate(!!S.outlet);
    },e=>console.warn('outletSettings',e));

    let unsubOrders=null, prevStatus={};
    onAuthStateChanged(auth,user=>{
      if(!user){ signInAnonymously(auth).catch(e=>console.warn('Enable Anonymous Auth',e)); return; }
      unsubOrders?.();
      unsubOrders=onSnapshot(query(collection(db,'orders'),where('customerUid','==',user.uid)),snap=>{
        const remote=snap.docs.map(d=>({firestoreId:d.id,...d.data()})).sort((a,b)=>tsMs(b)-tsMs(a));
        remote.forEach(o=>{
          const p=prevStatus[o.firestoreId];
          if(p && p!==o.status){
            vibrate([40,60,40]);
            const c=STATUS_COPY[o.status]; const t=Array.isArray(c)?c[0]:c?.[orderMode(o)]?.[0];
            if(t) snack(`#${o.id}: ${t}`,{label:'LIHAT',fn:()=>go('track/'+o.firestoreId)});
          }
          prevStatus[o.firestoreId]=o.status;
        });
        S.orders=remote; store.set('ay_orders',remote.slice(0,30).map(o=>({...o,createdAt:o.createdAt?{seconds:o.createdAt.seconds}:null,updatedAt:null})));
        if(['orders','track'].includes(S.view)) render(); else renderChrome();
      },e=>console.warn('orders',e));
    });
  }catch(e){
    console.error('Firebase gagal dimuatkan',e);
    snack('Mod luar talian — menu mungkin tidak terkini.');
  }
})();
</script>
</body>
</html>
