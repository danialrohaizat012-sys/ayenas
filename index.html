<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141212" media="(prefers-color-scheme: dark)">
<meta name="description" content="Order Ayenas Ayam Bakar — Pickup atau Delivery COD.">
<meta name="ayenas-build" content="v13-ux">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ayenas">
<title>Ayenas — Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block" rel="stylesheet">
<style>
/* =========================================================
   AYENAS v13 — Material 3 (Flutter look & feel), UX pass
   Brand: merah #E30613 · kuning #FFC928 · hitam
   ========================================================= */
:root{
  --primary:#D0101A; --on-primary:#FFFFFF;
  --primary-container:#FFE3DF; --on-primary-container:#5C0005;
  --secondary-container:#FFE38A; --on-secondary-container:#2B2100;
  --brand-yellow:#FFC928;
  --error:#BA1A1A; --error-container:#FFDAD6; --on-error-container:#410002;
  --success:#17803A; --success-container:#C9F2D1; --on-success-container:#00210B;
  --warn-container:#FFEBA8; --on-warn-container:#3A2C00;
  --surface:#FFFFFF; --on-surface:#1C1817; --on-surface-variant:#5E5654;
  --surface-c-low:#FAF7F6; --surface-c:#F5F1F0; --surface-c-high:#EFEAE9; --surface-c-highest:#E8E2E1;
  --outline:#8C8280; --outline-variant:#E2DAD8;
  --inverse-surface:#2F2B2A; --inverse-on-surface:#F7EFED; --inverse-primary:#FFB4AA;
  --scrim:rgba(0,0,0,.45);
  --elev1:0 1px 2px rgba(28,24,23,.12),0 1px 3px 1px rgba(28,24,23,.06);
  --elev2:0 2px 6px rgba(28,24,23,.10),0 1px 2px rgba(28,24,23,.12);
  --elev3:0 8px 24px rgba(28,24,23,.16),0 2px 6px rgba(28,24,23,.10);
  --ease:cubic-bezier(.2,0,0,1); --ease-dec:cubic-bezier(.05,.7,.1,1);
  --font:"Roboto Flex",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  --bar-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --primary:#FF8A7F; --on-primary:#4A0003;
    --primary-container:#7A0A10; --on-primary-container:#FFDAD5;
    --secondary-container:#5A4700; --on-secondary-container:#FFE38A;
    --error:#FFB4AB; --error-container:#93000A; --on-error-container:#FFDAD6;
    --success:#8BD99C; --success-container:#0B5227; --on-success-container:#C9F2D1;
    --warn-container:#574400; --on-warn-container:#FFEBA8;
    --surface:#141212; --on-surface:#EEE6E4; --on-surface-variant:#C9BFBD;
    --surface-c-low:#1C1A19; --surface-c:#211E1D; --surface-c-high:#2B2827; --surface-c-highest:#363231;
    --outline:#958C8A; --outline-variant:#3D3836;
    --inverse-surface:#EEE6E4; --inverse-on-surface:#2F2B2A; --inverse-primary:#D0101A;
    --scrim:rgba(0,0,0,.62);
    --elev1:0 1px 2px rgba(0,0,0,.5); --elev2:0 2px 6px rgba(0,0,0,.5); --elev3:0 8px 24px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:calc(var(--bar-h) + 56px + env(safe-area-inset-top))}
html,body{margin:0}
body{font-family:var(--font);background:var(--surface);color:var(--on-surface);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block}
a{color:inherit}
.ms{font-family:"Material Symbols Rounded";font-weight:400;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:"liga";-webkit-font-feature-settings:"liga";font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;user-select:none;flex:none;overflow:hidden;width:1em}
.ms.fill{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
.ms.sm{font-size:20px}.ms.xs{font-size:18px}

/* Type scale */
.headline-l{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.3px}
.headline-m{font-size:28px;line-height:36px;font-weight:700;letter-spacing:-.2px}
.headline-s{font-size:24px;line-height:32px;font-weight:700}
.title-l{font-size:20px;line-height:28px;font-weight:700}
.title-m{font-size:16px;line-height:24px;font-weight:650;letter-spacing:.1px}
.title-s{font-size:14px;line-height:20px;font-weight:650;letter-spacing:.1px}
.body-l{font-size:16px;line-height:24px;letter-spacing:.2px}
.body-m{font-size:14px;line-height:20px;letter-spacing:.2px}
.body-s{font-size:12px;line-height:16px;letter-spacing:.3px}
.label-l{font-size:14px;line-height:20px;font-weight:650}
.label-m{font-size:12px;line-height:16px;font-weight:650;letter-spacing:.4px}
.muted{color:var(--on-surface-variant)}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Shell */
#app{max-width:640px;margin:0 auto;min-height:100vh;position:relative;background:var(--surface)}
@media (min-width:680px){body{background:var(--surface-c)} #app{box-shadow:var(--elev1)}}
.view{display:none;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.view.active{display:block;animation:enter .3s var(--ease-dec)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
body.focus-mode .navbar{transform:translateY(110%)}

/* Ripple */
.ink{position:relative;overflow:hidden;isolation:isolate}
.ink::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .2s;pointer-events:none}
@media (hover:hover){.ink:hover::after{opacity:.06}}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.16;transform:scale(0);animation:ripple .55s var(--ease) forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(1);opacity:0}}

/* Top app bar */
.appbar{position:sticky;top:0;z-index:20;background:var(--surface);height:calc(var(--bar-h) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 4px 0 4px;display:flex;align-items:center;gap:4px;transition:box-shadow .2s,background .2s}
.appbar.scrolled{box-shadow:0 1px 0 var(--outline-variant)}
.appbar .title{flex:1;min-width:0;padding-left:4px}
.icon-btn{width:48px;height:48px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;color:var(--on-surface);flex:none;position:relative}
.icon-btn .nb{position:absolute;top:6px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--primary);color:var(--on-primary);font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface)}
.icon-btn .nb[data-n="0"]{display:none}

.home-bar{padding-left:12px;padding-right:4px}
.home-bar .logo{width:40px;height:40px;border-radius:12px;object-fit:cover;flex:none}
.outlet-btn{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:12px;display:flex;flex-direction:column}
.outlet-btn .r{display:flex;align-items:center;gap:2px}
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--success);flex:none}
.sdot.busy{background:#E0A100}.sdot.closed{background:var(--error)}

/* Order-mode card */
.mode-card{margin:4px 16px 0;border-radius:20px;background:var(--surface-c);padding:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:transparent}
.seg button{height:44px;border:0;border-radius:14px;background:transparent;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:650;color:var(--on-surface-variant);transition:background .2s var(--ease),color .2s,box-shadow .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--on-surface);box-shadow:var(--elev1)}
.seg button[aria-pressed="true"] .ms{color:var(--primary);font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.mode-info{display:flex;align-items:center;gap:10px;padding:10px 10px 6px;border:0;background:transparent;width:100%;text-align:left;border-radius:12px}
.mode-info .ms{color:var(--on-surface-variant)}

/* Search */
.search{margin:12px 16px 0;display:flex;align-items:center;gap:10px;height:48px;border-radius:24px;background:var(--surface-c);padding:0 6px 0 16px;color:var(--on-surface-variant)}
.search input{flex:1;border:0;background:transparent;outline:none;font-size:16px;color:var(--on-surface);min-width:0;height:100%}
.search input::placeholder{color:var(--on-surface-variant)}
.search input::-webkit-search-cancel-button{display:none}

/* Banner */
.banner{display:flex;gap:12px;align-items:flex-start;margin:12px 16px 0;padding:12px 14px;border-radius:14px;font-size:14px;line-height:20px}
.banner.warn{background:var(--warn-container);color:var(--on-warn-container)}
.banner.err{background:var(--error-container);color:var(--on-error-container)}
.banner.info{background:var(--surface-c);color:var(--on-surface)}

/* Featured carousel */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:24px 16px 12px}
.carousel{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-padding:0 16px}
.carousel::-webkit-scrollbar{display:none}
.fcard{flex:0 0 min(78%,300px);scroll-snap-align:start;border:0;padding:0;text-align:left;background:var(--surface-c-low);border-radius:20px;overflow:hidden;color:var(--on-surface);display:flex;flex-direction:column;box-shadow:inset 0 0 0 1px var(--outline-variant)}
.fcard .img{aspect-ratio:16/10;position:relative;background:var(--surface-c-high);overflow:hidden}
.fcard .img img{width:100%;height:100%;object-fit:cover}
.fcard .b{padding:12px 14px 14px;display:flex;align-items:center;gap:12px}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:10.5px;font-weight:750;letter-spacing:.5px;background:var(--brand-yellow);color:#2B2100}
.img .tag{position:absolute;top:10px;left:10px}

/* Sticky category tabs (scrollspy) */
.tabs{position:sticky;top:calc(var(--bar-h) + env(safe-area-inset-top));z-index:15;background:var(--surface);display:flex;gap:4px;overflow-x:auto;padding:8px 12px;scrollbar-width:none;border-bottom:1px solid var(--outline-variant);margin-top:16px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:36px;border:0;border-radius:18px;padding:0 14px;background:transparent;font-size:14px;font-weight:650;color:var(--on-surface-variant);transition:background .2s,color .2s}
.tab[aria-selected="true"]{background:var(--on-surface);color:var(--surface)}

/* Product rows */
.cat-h{padding:24px 16px 4px}
.prow{display:flex;gap:16px;padding:16px;align-items:stretch;cursor:pointer;position:relative}
.prow+.prow::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--outline-variant)}
.prow .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.prow .price-row{margin-top:auto;padding-top:6px;display:flex;align-items:center;gap:8px}
.price{font-weight:700;font-size:15px;color:var(--on-surface)}
.prow .pimg{width:112px;height:112px;flex:none;position:relative}
.prow .pimg img{width:100%;height:100%;object-fit:cover;border-radius:16px;background:var(--surface-c-high)}
.prow.soldout{cursor:default}
.prow.soldout .pimg img{filter:grayscale(1);opacity:.5}
.prow.soldout .info{opacity:.55}
.add{position:absolute;right:-6px;bottom:-6px;width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);color:var(--primary);display:grid;place-items:center;box-shadow:var(--elev2)}
.add.has{background:var(--primary);color:var(--on-primary);font-weight:750;font-size:14px}
.qpill{position:absolute;right:-6px;bottom:-6px;height:40px;border-radius:20px;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;box-shadow:var(--elev2)}
.qpill button{width:38px;height:40px;border:0;background:transparent;color:inherit;display:grid;place-items:center;border-radius:20px}
.qpill b{min-width:16px;text-align:center;font-size:14px}
.sold-tag{position:absolute;left:8px;bottom:8px;background:var(--inverse-surface);color:var(--inverse-on-surface);font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}

/* Buttons */
.btn{height:40px;border:0;border-radius:20px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:650;white-space:nowrap;text-decoration:none}
.btn.lg{height:52px;border-radius:26px;font-size:16px;padding:0 24px}
.btn.block{width:100%}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--surface-c-high);color:var(--on-surface)}
.btn.yellow{background:var(--brand-yellow);color:#2B2100}
.btn.outlined{background:transparent;box-shadow:inset 0 0 0 1px var(--outline);color:var(--on-surface)}
.btn.text{background:transparent;color:var(--primary);padding:0 12px}
.btn:disabled{background:var(--surface-c-highest);color:color-mix(in srgb,var(--on-surface) 40%,transparent);box-shadow:none;cursor:not-allowed}

/* Fields */
.field{position:relative;margin:0 0 14px}
.field input,.field textarea{width:100%;border:1px solid var(--outline);border-radius:12px;background:var(--surface);padding:16px;font-size:16px;color:var(--on-surface);outline:none;resize:none;transition:border-color .15s,box-shadow .15s}
.field textarea{min-height:84px}
.field label{position:absolute;left:12px;top:16px;padding:0 4px;background:var(--surface);color:var(--on-surface-variant);font-size:16px;line-height:24px;pointer-events:none;transition:all .15s var(--ease);border-radius:4px}
.field input:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.field input:focus+label,.field textarea:focus+label,.field input:not(:placeholder-shown)+label,.field textarea:not(:placeholder-shown)+label{top:-9px;font-size:12px;line-height:16px}
.field input:focus+label,.field textarea:focus+label{color:var(--primary)}
.field .support{font-size:12px;line-height:16px;color:var(--on-surface-variant);padding:4px 14px 0}
.field.err input,.field.err textarea{border-color:var(--error);box-shadow:0 0 0 1px var(--error)}
.field.err label,.field.err .support{color:var(--error)}
.field .prefix{position:absolute;left:16px;top:16px;font-size:16px;line-height:24px;color:var(--on-surface-variant)}
.field.has-prefix input{padding-left:50px}
.field.has-prefix label{left:46px}
.field.has-prefix input:focus+label,.field.has-prefix input:not(:placeholder-shown)+label{left:12px}

/* Groups / tiles */
.group{margin:0 16px 12px;border-radius:20px;background:var(--surface-c-low);box-shadow:inset 0 0 0 1px var(--outline-variant);overflow:hidden}
.group-pad{padding:16px}
.group-h{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 10px}
.tile{display:flex;gap:14px;align-items:center;padding:14px 16px;min-height:56px;width:100%;border:0;background:transparent;text-align:left;color:var(--on-surface)}
.tile .lead{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-c-high);color:var(--on-surface);flex:none}
.tile .lead.red{background:var(--primary-container);color:var(--on-primary-container)}
.tile .lead.ok{background:var(--success-container);color:var(--on-success-container)}
.tile .mid{flex:1;min-width:0}
.hr{height:1px;background:var(--outline-variant);margin:0 16px}

/* Navigation bar */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:640px;margin:0 auto;height:calc(72px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--outline-variant);display:flex;transition:transform .3s var(--ease)}
.navbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--on-surface-variant);font-size:12px;font-weight:650}
.navbar .ind{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;position:relative;transition:background .25s var(--ease)}
.navbar button[aria-current="page"]{color:var(--on-surface)}
.navbar button[aria-current="page"] .ind{background:var(--secondary-container);color:var(--on-secondary-container)}
.navbar button[aria-current="page"] .ms{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
.nbadge{position:absolute;top:-2px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--primary);color:var(--on-primary);font-size:10px;font-weight:750;display:grid;place-items:center;padding:0 4px}
.nbadge[data-n="0"]{display:none}

/* Cart bar */
.cartbar{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));z-index:29;max-width:640px;margin:0 auto;padding:0 12px;pointer-events:none;transform:translateY(20px);opacity:0;transition:all .3s var(--ease-dec)}
.cartbar.show{transform:none;opacity:1}
.cartbar button{pointer-events:auto;width:100%;height:56px;border:0;border-radius:18px;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;gap:12px;padding:0 8px 0 18px;box-shadow:var(--elev3);font-weight:650;font-size:15px}
.cartbar .cnt{min-width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:13px}
.cartbar .tot{background:rgba(0,0,0,.18);height:40px;border-radius:12px;padding:0 12px;display:flex;align-items:center;gap:4px}
.cartbar.bump button{animation:bump .35s var(--ease)}
@keyframes bump{40%{transform:scale(1.03)}}

/* Sticky checkout footer */
.checkout-bar{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:640px;margin:0 auto;background:var(--surface);border-top:1px solid var(--outline-variant);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none;align-items:center;gap:16px}
body.focus-mode .checkout-bar.on{display:flex}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:640px;margin:0 auto;background:var(--surface);border-radius:28px 28px 0 0;max-height:94vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .34s var(--ease-dec),visibility 0s .34s;visibility:hidden}
.sheet.show{transform:none;visibility:visible;transition:transform .34s var(--ease-dec)}
.sheet .handle{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.85);z-index:3;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sheet .scroll{overflow-y:auto;flex:1;overscroll-behavior:contain;border-radius:28px 28px 0 0}
.sheet .actions{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--outline-variant);display:flex;gap:12px;align-items:center}
.sheet-img{aspect-ratio:4/3;max-height:42vh;width:100%;background:var(--surface-c-high);position:relative}
.sheet-img img{width:100%;height:100%;object-fit:cover}
.sheet-close{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;backdrop-filter:blur(6px);z-index:3}
.opt-h{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 8px}
.opt{display:flex;align-items:center;gap:14px;padding:12px 20px;min-height:52px;cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.cbox{width:22px;height:22px;border:2px solid var(--outline);border-radius:6px;display:grid;place-items:center;flex:none;transition:all .15s}
.cbox .ms{font-size:18px;color:var(--on-primary);opacity:0;font-variation-settings:"FILL" 0,"wght" 700,"GRAD" 0,"opsz" 20}
.opt input:checked+.cbox{background:var(--primary);border-color:var(--primary)}
.opt input:checked+.cbox .ms{opacity:1}
.opt input:focus-visible+.cbox{outline:3px solid var(--primary);outline-offset:2px}

.stepper{display:flex;align-items:center;background:var(--surface-c-high);border-radius:26px;height:52px}
.stepper button{width:48px;height:52px;border:0;background:transparent;display:grid;place-items:center;color:var(--on-surface);border-radius:26px}
.stepper button:disabled{opacity:.35}
.stepper b{min-width:20px;text-align:center;font-size:16px}
.stepper.sm{height:36px;border-radius:18px}
.stepper.sm button{width:36px;height:36px}
.stepper.sm b{font-size:14px}

/* Time slots */
.slots{display:flex;gap:8px;overflow-x:auto;padding:0 16px 16px;scrollbar-width:none}
.slots::-webkit-scrollbar{display:none}
.slot{flex:none;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--outline-variant);background:var(--surface);font-size:14px;font-weight:650;color:var(--on-surface)}
.slot[aria-pressed="true"]{background:var(--on-surface);color:var(--surface);border-color:transparent}

/* Cart lines */
.line{display:flex;gap:12px;padding:14px 16px;align-items:flex-start}
.line img{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--surface-c-high);flex:none}
.line .mid{flex:1;min-width:0}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:14px;line-height:20px}
.sumrow.total{font-size:18px;line-height:26px;font-weight:750;padding-top:12px;margin-top:8px;border-top:1px dashed var(--outline-variant)}

/* Empty */
.empty{text-align:center;padding:72px 32px;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .art{width:112px;height:112px;border-radius:50%;background:var(--surface-c);display:grid;place-items:center;color:var(--primary);margin-bottom:12px}
.empty .art .ms{font-size:52px}

/* Tracking */
.track-hero{margin:4px 16px 16px;border-radius:28px;padding:22px;background:var(--on-surface);color:var(--surface);position:relative;overflow:hidden}
.track-hero.ready{background:var(--success);color:#fff}
.track-hero.cancelled{background:var(--error-container);color:var(--on-error-container)}
.track-hero .num{font-size:40px;line-height:48px;font-weight:800;letter-spacing:-.5px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:750;letter-spacing:.6px}
.live i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.progress{display:flex;gap:4px;margin-top:18px}
.progress i{flex:1;height:4px;border-radius:2px;background:currentColor;opacity:.25}
.progress i.on{opacity:1}
.progress i.cur{opacity:1;animation:pulse 1.4s infinite}
.vsteps{padding:18px 16px 18px 20px}
.vstep{display:flex;gap:14px;position:relative;padding-bottom:18px}
.vstep:last-child{padding-bottom:0}
.vstep::before{content:"";position:absolute;left:11px;top:26px;bottom:2px;width:2px;background:var(--outline-variant)}
.vstep:last-child::before{display:none}
.vstep.done::before{background:var(--primary)}
.vstep .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--outline-variant);display:grid;place-items:center;flex:none;background:var(--surface);z-index:1}
.vstep.done .dot{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.vstep.current .dot{border-color:var(--primary);box-shadow:0 0 0 5px color-mix(in srgb,var(--primary) 18%,transparent)}
.vstep.current .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}
.vstep .ms{font-size:16px}

.ocard{display:block;width:calc(100% - 32px);text-align:left;border:0;background:var(--surface-c-low);box-shadow:inset 0 0 0 1px var(--outline-variant);border-radius:20px;margin:0 16px 12px;padding:16px;color:var(--on-surface)}
.ocard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip-s{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:750;letter-spacing:.4px;background:var(--surface-c-highest);color:var(--on-surface-variant)}
.chip-s.new{background:var(--secondary-container);color:var(--on-secondary-container)}
.chip-s.preparing{background:var(--primary-container);color:var(--on-primary-container)}
.chip-s.ready,.chip-s.on-the-way{background:var(--success-container);color:var(--on-success-container)}
.chip-s.cancelled{background:var(--error-container);color:var(--on-error-container)}

/* Snackbar */
.snackbar{position:fixed;left:12px;right:12px;bottom:calc(152px + env(safe-area-inset-bottom));z-index:80;max-width:616px;margin:0 auto;background:var(--inverse-surface);color:var(--inverse-on-surface);border-radius:12px;min-height:48px;padding:12px 8px 12px 16px;font-size:14px;box-shadow:var(--elev3);display:flex;align-items:center;gap:12px;transform:translateY(12px);opacity:0;pointer-events:none;transition:all .25s var(--ease-dec)}
.snackbar.show{transform:none;opacity:1;pointer-events:auto}
.snackbar.low{bottom:calc(96px + env(safe-area-inset-bottom))}
.snackbar .act{margin-left:auto;background:none;border:0;color:var(--inverse-primary);font-weight:750;padding:8px 10px;border-radius:8px}

/* Dialog */
.dialog{position:fixed;z-index:61;left:50%;top:50%;width:min(380px,calc(100% - 40px));transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none;background:var(--surface);border-radius:28px;padding:24px;transition:all .25s var(--ease-dec);box-shadow:var(--elev3)}
.dialog.show{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.dialog-scrim{z-index:60}

/* Gate */
.gate{position:fixed;inset:0;z-index:70;background:var(--surface);overflow-y:auto;display:none}
.gate.show{display:block;animation:enter .35s var(--ease-dec)}
.gate-hero{height:min(40vh,320px);position:relative;background:#1a0705}
.gate-hero img{width:100%;height:100%;object-fit:cover;opacity:.85}
.gate-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,var(--surface))}
.gate-inner{max-width:640px;margin:-64px auto 0;padding:0 16px calc(24px + env(safe-area-inset-bottom));position:relative;z-index:1}
.gate-logo{width:72px;height:72px;border-radius:22px;box-shadow:var(--elev3);margin-bottom:16px;border:3px solid var(--surface)}
.outlet-card{display:flex;gap:14px;align-items:center;border:0;width:100%;text-align:left;padding:16px;border-radius:20px;background:var(--surface-c-low);box-shadow:inset 0 0 0 1px var(--outline-variant);margin-bottom:12px;color:var(--on-surface)}
.outlet-card .pin{width:48px;height:48px;border-radius:14px;background:var(--primary-container);color:var(--on-primary-container);display:grid;place-items:center;flex:none}
.outlet-card[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--primary)}

/* Success */
.success{position:fixed;inset:0;z-index:90;background:var(--surface);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom))}
.success.show{display:flex;animation:enter .3s var(--ease-dec)}
.check-anim{width:112px;height:112px;border-radius:50%;background:var(--success);display:grid;place-items:center;color:#fff;animation:pop .5s var(--ease-dec);box-shadow:0 0 0 14px color-mix(in srgb,var(--success) 18%,transparent)}
.check-anim .ms{font-size:64px;font-variation-settings:"FILL" 0,"wght" 600,"GRAD" 0,"opsz" 48}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}

/* Splash */
#splash{position:fixed;inset:0;z-index:100;background:#E30613;display:grid;place-items:center;transition:opacity .35s var(--ease),visibility .35s}
#splash.hide{opacity:0;visibility:hidden}
#splash img{width:96px;height:96px;border-radius:28px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .6s var(--ease-dec)}

.spin{width:20px;height:20px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>

const outletInfo = id => { const o=OUTLETS[id]; if(!o) return null; const st=S.settings[id]||{};
  return {...o, phone:String(st.phone||o.phone||'').replace(/\D/g,''), hours:Array.isArray(st.hours)&&st.hours.length===7?st.hours:o.hours, address:st.address||o.address}; };
const toMin = t => { const [h,m]=String(t).split(':').map(Number); return h*60+(m||0); };
const hhmm = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const label12 = m => { const d=new Date(); d.setHours(Math.floor(m/60), m%60, 0, 0); return fmtTime(d.getTime()); };
const waLink = (p,msg) => `https://wa.me/${p}${msg?'?text='+encodeURIComponent(msg):''}`;
function hoursState(id=S.outlet){
  const o=outletInfo(id); if(!o?.hours) return {open:true,text:'',close:null};
  const now=new Date(), d=now.getDay(), mins=now.getHours()*60+now.getMinutes(), h=o.hours[d];
  if(h && mins>=toMin(h[0]) && mins<toMin(h[1])) return {open:true,text:`Buka hingga ${label12(toMin(h[1]))}`,close:toMin(h[1])};
  if(h && mins<toMin(h[0])) return {open:false,text:`Buka hari ini ${label12(toMin(h[0]))}`,openAt:toMin(h[0]),close:toMin(h[1])};
  for(let i=1;i<=7;i++){ const n=o.hours[(d+i)%7]; if(n) return {open:false,text:`Buka ${i===1?'esok':DAYS[(d+i)%7]} ${label12(toMin(n[0]))}`}; }
  return {open:false,text:''};
}
function pickupSlots(){
  const hs=hoursState(); const now=new Date(); const nowM=now.getHours()*60+now.getMinutes();
  if(!hs.open && !hs.openAt) return [];
  let start=Math.max(nowM+prepMin()+15, hs.openAt?hs.openAt+prepMin():0);
  start=Math.ceil(start/15)*15;
  const end=(hs.close ?? (nowM+180))-15;
  const out=[]; for(let m=start;m<=end && out.length<24;m+=15) out.push(m);
  return out;
}

/* Ripple */
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.ink,.btn,.prow,.fcard,.tab,.ocard,.outlet-card,.add,.slot,.seg button');
  if(!el || el.disabled) return;
  const r=el.getBoundingClientRect(), size=Math.max(r.width,r.height)*2.2, s=document.createElement('span');
  s.className='ripple'; s.style.cssText=`width:${size}px;height:${size}px;left:${e.clientX-r.left-size/2}px;top:${e.clientY-r.top-size/2}px`;
  if(getComputedStyle(el).position==='static') el.style.position='relative';
  el.style.overflow='hidden'; el.appendChild(s); setTimeout(()=>s.remove(),600);
},{passive:true});

/* Snackbar */
let snackT;
function snack(msg, action){
  const el=$('#snackbar'), focus=document.body.classList.contains('focus-mode');
  el.classList.toggle('low', focus || !$('#cartbar').classList.contains('show'));
  el.innerHTML=`<span style="flex:1">${esc(msg)}</span>`+(action?`<button class="act">${esc(action.label)}</button>`:'');
  if(action) el.querySelector('.act').onclick=()=>{ el.classList.remove('show'); action.fn(); };
  el.classList.add('show'); clearTimeout(snackT);
  snackT=setTimeout(()=>el.classList.remove('show'), action?4000:2400);
}

    const close=v=>{ d.classList.remove('show'); sc.classList.remove('show'); res(v); };

function enableSheetDrag(sh){
  const sc=sh.querySelector('.scroll'); let y0=null, dy=0;
  sh.ontouchstart=e=>{ if(sc && sc.scrollTop>0) return; y0=e.touches[0].clientY; };
  sh.ontouchmove=e=>{ if(y0==null) return; dy=e.touches[0].clientY-y0; if(dy>0){ sh.style.transition='none'; sh.style.transform=`translateY(${dy}px)`; } };
  sh.ontouchend=()=>{ if(y0==null) return; sh.style.transition=''; sh.style.transform=''; if(dy>120) closeSheet(); y0=null; dy=0; };

const VIEWS=['menu','cart','orders','track','profile'];

function go(view,opts={}){
  const [v,param]=view.split('/');
  if(!VIEWS.includes(v)) return go('menu',opts);
  const prev=S.view; S.view=v; if(v==='track') S.trackId=param||S.trackId;
  const hash='#/'+view;
  if(location.hash!==hash){ if(opts.replace) history.replaceState(null,'',hash); else { history.pushState(null,'',hash); navDepth++; } }
  $$('.view').forEach(x=>x.classList.toggle('active',x.id==='view-'+v));
  $$('.navbar [data-nav]').forEach(b=>b.setAttribute('aria-current', b.dataset.nav===(v==='track'?'orders':v)?'page':'false'));
  document.body.classList.toggle('focus-mode', v==='cart');
  if(!(prev==='menu'&&v==='menu')) window.scrollTo({top:0});
  render();
}

function setupSpy(){

    const vis=ents.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];

function addToCart(p,qty,addonList,note,silent){
  if(isSoldOut(p)) return snack('Menu ini sudah habis.');

  else S.cart.push({key,id:p.id,name:p.name,price:num(p.price),category:p.category||'',imageUrl:imgSrc(p).startsWith('data:')?'':imgSrc(p),qty,extras:addonList.reduce((s,a)=>s+a.price,0),extrasList:addonList.map(a=>a.name),note});
  persist(); vibrate(12); render();
  const cb=$('#cartbar'); cb.classList.remove('bump'); void cb.offsetWidth; cb.classList.add('bump');
  if(!silent) snack(`${p.name} ditambah ke troli`);
}
function quickAdd(id){ const p=S.products.find(x=>x.id===id); if(p) addToCart(p,1,[],'',true); }
function changeQty(key,d){
  const l=S.cart.find(x=>x.key===key); if(!l) return;
  l.qty+=d;
  if(l.qty<=0){
    const idx=S.cart.indexOf(l), removed={...l,qty:1}; S.cart.splice(idx,1);
    snack(`${l.name} dibuang`,{label:'UNDO',fn:()=>{ S.cart.splice(idx,0,removed); persist(); render(); }});
  }
  persist(); vibrate(6); render();
}

        <span class="mid"><span class="body-s muted">${isDel?'Dihantar dari':'Ambil di'}</span><br><span class="title-s">${esc(o?.name||'Pilih outlet')}</span><br><span class="body-s muted ellipsis" style="display:block">${esc(o?.address||'')}</span></span>
        <span class="label-l" style="color:var(--primary)">Tukar</span>
      </button>
      ${isDel?'':`<div class="hr"></div>
      <div class="tile" style="padding-bottom:10px"><span class="lead"><span class="ms sm">schedule</span></span><span class="mid"><span class="title-s">Masa ambil</span><br><span class="body-s muted">${S.pickupAt==='asap'?`Siap dalam ~${prepMin()} min selepas order`:`Sedia pada ${label12(Number(S.pickupAt))}`}</span></span></div>
      <div class="slots" role="group" aria-label="Pilih masa ambil">
        ${asapOk?`<button class="slot" data-slot="asap" aria-pressed="${S.pickupAt==='asap'}">Secepat mungkin</button>`:''}

      </div>`}

    ${isDel?`

    <div class="group"><div class="group-pad" style="padding-bottom:2px">
      <div class="field" id="fAddr"><textarea id="cAddr" placeholder=" " rows="3" maxlength="300" autocomplete="street-address">${esc(P.address)}</textarea><label for="cAddr">Alamat penuh</label><div class="support">No. rumah, jalan, taman / kampung</div></div>

        <div class="mid">
          <div class="title-s">${esc(l.name)}</div>

            <span class="title-s">${money(lineUnit(l)*l.qty)}</span>
            <div class="stepper sm"><button data-q="${esc(l.key)}" data-d="-1" aria-label="Kurang"><span class="ms sm">${l.qty===1?'delete':'remove'}</span></button><b>${l.qty}</b><button data-q="${esc(l.key)}" data-d="1" aria-label="Tambah"><span class="ms sm">add</span></button></div>
          </div>
        </div>
      </div>`).join('')}
      <div class="hr"></div>
      <div class="group-pad">
        <div class="sumrow"><span class="muted">Subtotal</span><span>${money(sub)}</span></div>
        ${isDel?`<div class="sumrow"><span class="muted">Caj penghantaran</span><span>${money(fee)}</span></div>`:''}
        <div class="sumrow total"><span>Jumlah</span><span>${money(total)}</span></div>
      </div>
    </div>

    <div class="group-h"><div class="title-m">Bayaran</div></div>
    <div class="group"><div class="tile">
      <span class="lead ok"><span class="ms sm">${isDel?'payments':'point_of_sale'}</span></span>
      <span class="mid"><span class="title-s">${isDel?'Tunai semasa terima (COD)':'Bayar di kaunter'}</span><br><span class="body-s muted">${isDel?`Sediakan ${money(total)} tunai untuk rider`:'Tunai atau QR semasa ambil order'}</span></span>
      <span class="ms" style="color:var(--success)">check_circle</span>

  const blocked = st==='closed' || !o || (minOrder && sub<minOrder) || (!isDel && !asapOk && !slots.length);
  bar.classList.add('on');
  $('#coTotal').textContent=money(total);
  const pb=$('#placeBtn'); pb.disabled=!!blocked||S.placing;
  pb.innerHTML=S.placing?'<span class="spin"></span>Menghantar…':(isDel?'Hantar order COD':'Hantar order pickup');

  el.querySelectorAll('[data-seg2] button').forEach(b=>b.onclick=()=>{ saveForm(); setMode(b.dataset.mode); });
  el.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ saveForm(); changeQty(b.dataset.q,Number(b.dataset.d)); });
  el.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{ saveForm(); S.pickupAt=b.dataset.slot==='asap'?'asap':Number(b.dataset.slot); vibrate(5); renderCart(); });
  $('#chgOutlet').onclick=()=>{ saveForm(); showGate(true); };
  $('#addMore').onclick=()=>{ saveForm(); go('menu'); };
  $('#pinBtn') && ($('#pinBtn').onclick=pinLocation);

$('#placeBtn').onclick=()=>placeOrder();
$('#clearCart').onclick=async()=>{ if(await dialog({icon:'delete',title:'Kosongkan troli?',body:'Semua item dalam troli akan dibuang.',confirm:'Kosongkan',cancel:'Batal',danger:true})){ S.cart=[]; persist(); render(); } };

function saveForm(){
  const v=id=>document.getElementById(id)?.value;
  if(v('cName')!=null) S.profile.name=v('cName').trim();
  if(v('cPhone')!=null) S.profile.phone=v('cPhone').trim();
  if(v('cAddr')!=null) S.profile.address=v('cAddr').trim();
  if(v('cAddrNote')!=null) S.profile.addressNote=v('cAddrNote').trim();
  persist();
}
function pinLocation(){
  if(!navigator.geolocation) return snack('Peranti ini tidak menyokong lokasi.');
  saveForm(); $('#pinText').textContent='Mencari lokasi…';
  navigator.geolocation.getCurrentPosition(
    p=>{ S.location={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),accuracy:p.coords.accuracy}; vibrate(15); renderCart(); snack('Lokasi berjaya dipin'); },
    e=>{ $('#pinText').textContent=e.code===1?'Akses lokasi ditolak. Benarkan dalam tetapan browser.':'Gagal dapatkan lokasi. Cuba lagi.'; },
    {enableHighAccuracy:true,timeout:15000,maximumAge:60000});
}
function fieldErr(id,msg){
  const f=document.getElementById(id); if(!f) return;
  f.classList.add('err');
  let s=f.querySelector('.support'); if(!s){ s=document.createElement('div'); s.className='support'; f.appendChild(s); }
  s.dataset.orig ??= s.textContent; s.textContent=msg;
  f.querySelector('input,textarea')?.addEventListener('input',()=>{ f.classList.remove('err'); s.textContent=s.dataset.orig; },{once:true});
}

async function placeOrder(){
  if(S.placing) return;
  saveForm();
  const P=S.profile, isDel=S.mode==='delivery';
  let first=null;
  if(isDel && P.address.length<10){ fieldErr('fAddr','Masukkan alamat yang lengkap'); first??='cAddr'; }
  if(P.name.length<2){ fieldErr('fName','Masukkan nama anda'); first??='cName'; }
  if(!validPhone(P.phone)){ fieldErr('fPhone','Nombor tidak sah. Contoh: 012 345 6789'); first??='cPhone'; }
  if(first){ const i=document.getElementById(first); i.scrollIntoView({behavior:'smooth',block:'center'}); setTimeout(()=>i.focus({preventScroll:true}),300); vibrate([20,40,20]); return; }
  if(!S.outlet) return showGate(true);
  if(outletStatus()==='closed') return snack('Outlet sedang tutup.');
  const bad=S.cart.filter(l=>{ const p=S.products.find(x=>x.id===l.id); return !p||p.active===false||isSoldOut(p); });
  if(bad.length) return dialog({icon:'error',title:'Ada item tidak tersedia',body:`${bad.map(l=>esc(l.name)).join(', ')} tidak tersedia di outlet ini. Sila buang dari troli.`});
  if(!S.fb) return dialog({icon:'wifi_off',title:'Tiada sambungan',body:'App tidak dapat sambung ke server. Semak internet anda dan cuba lagi.'});

  const o=OUTLETS[S.outlet], sub=subtotal(), fee=deliveryFee(), total=Math.round((sub+fee)*100)/100;
  const when = S.pickupAt==='asap'?`~${prepMin()} min`:label12(Number(S.pickupAt));
  const ok=await dialog({
    title:'Sahkan order',
    body:`<div style="display:grid;gap:12px;color:var(--on-surface)">
      <div style="display:flex;gap:12px"><span class="ms sm">${isDel?'two_wheeler':'storefront'}</span><span><b>${isDel?'Delivery COD':'Pickup'}</b> · ${esc(o.short)}<br><span class="muted">${isDel?esc(P.address.slice(0,60)):`Masa ambil: ${esc(when)}`}</span></span></div>
      <div style="display:flex;gap:12px"><span class="ms sm">receipt_long</span><span>${cartCount()} item · <b>${money(total)}</b></span></div>
      <div style="display:flex;gap:12px"><span class="ms sm">payments</span><span>${isDel?'Bayar tunai kepada rider':'Bayar di kaunter'}</span></div></div>`,
    confirm:'Hantar order', cancel:'Semak'
  });
  if(!ok) return;

  S.placing=true; renderCart();
  const phone=normPhone(P.phone);
  const scheduled = !isDel && S.pickupAt!=='asap' ? hhmm(Number(S.pickupAt)) : null;
  const order={
    id:'AY'+Date.now().toString().slice(-7),
    created:new Date().toISOString(),
    name:P.name, phone,
    mode:S.mode, orderType:S.mode,
    outlet:S.outlet, outletId:S.outlet,
    items:S.cart.map(l=>({id:l.id,name:l.name,price:l.price,qty:l.qty,extras:l.extras,extrasList:l.extrasList||[],note:l.note||'',category:l.category||'',imageUrl:l.imageUrl||''})),
    itemCount:cartCount(),
    subtotal:Math.round(sub*100)/100, deliveryFee:fee, total,
    status:'new', orderStatus:'new',
    etaMinutes:num(setting().defaultEta),
    pickupTime:scheduled,
    paymentMethod:isDel?'cod':'counter', paymentStatus:'unpaid',
    deliveryAddress:isDel?P.address:null,
    deliveryNote:isDel?(P.addressNote||''):null,
    deliveryContact:isDel?phone:null,
    deliveryLocation:isDel&&S.location?{lat:S.location.lat,lng:S.location.lng}:null,
    source:'web-v13'
  };
  try{ const ref=await S.fb.createOrder(order); order.firestoreId=ref.id; }
  catch(err){
    console.error(err); S.placing=false; renderCart();
    return dialog({icon:'wifi_off',title:'Order gagal dihantar',body:'Semak sambungan internet anda dan cuba lagi. Troli anda masih disimpan.'});
  }
  S.placing=false;
  S.orders=[order,...S.orders.filter(x=>x.firestoreId!==order.firestoreId)];
  store.set('ay_orders',S.orders.slice(0,30));
  S.cart=[]; S.pickupAt='asap'; persist(); vibrate([30,60,30]);
  showSuccess(order);
}
function showSuccess(o){
  const isDel=orderMode(o)==='delivery';
  $('#sucNo').textContent='#'+o.id;
  $('#sucSub').textContent = isDel ? 'Kami akan hantar ke alamat anda. Sediakan tunai untuk rider.' : (o.pickupTime?`Order anda akan siap pada ${label12(toMin(o.pickupTime))}. Bayar di kaunter.`:`Order anda akan siap dalam ~${prepMin()} min. Bayar di kaunter.`);
  const s=$('#success'); s.classList.add('show');
  $('#sucTrack').onclick=()=>{ s.classList.remove('show'); go('track/'+o.firestoreId,{replace:true}); };
  $('#sucMenu').onclick=()=>{ s.classList.remove('show'); go('menu',{replace:true}); };
  $('#sucTrack').focus();
}

/* ---------- Orders ---------- */
function statusChip(o){
  const s=o.status||'new', m=orderMode(o);
  const t = s==='ready' ? (m==='pickup'?'SEDIA DIAMBIL':'SEDIA DIHANTAR') : ({new:'DITERIMA',preparing:'DISEDIAKAN','on-the-way':'DALAM PERJALANAN',cancelled:'DIBATALKAN'}[s] || (FINAL.includes(s)?'SELESAI':s.toUpperCase()));
  return `<span class="chip-s ${esc(s)}">${t}</span>`;
}
function renderOrders(){
  const el=$('#ordersBody');
  if(!S.orders.length){
    el.innerHTML=`<div class="empty"><div class="art"><span class="ms">receipt_long</span></div><div class="title-l">Belum ada pesanan</div><div class="body-m muted">Status pesanan anda akan dipaparkan di sini secara live.</div><button class="btn filled lg" style="margin-top:16px" id="toMenu2">Mula order</button></div>`;
    $('#toMenu2').onclick=()=>go('menu'); return;
  }
  const active=S.orders.filter(isActiveOrder), past=S.orders.filter(o=>!isActiveOrder(o));
  const card=o=>{ const t=tsMs(o), m=orderMode(o);
    return `<div class="ocard ink" data-track="${esc(o.firestoreId||'')}" role="button" tabindex="0">
      <div class="top"><span class="title-m">#${esc(o.id||'')}</span>${statusChip(o)}</div>
      <div class="body-s muted" style="margin-top:6px;display:flex;align-items:center;gap:6px"><span class="ms xs">${m==='delivery'?'two_wheeler':'storefront'}</span>${m==='delivery'?'Delivery COD':'Pickup'} · ${esc(OUTLETS[o.outletId]?.short||'')} · ${fmtDate(t)}, ${fmtTime(t)}</div>
      <div class="body-m ellipsis" style="margin-top:8px">${(o.items||[]).map(i=>`${num(i.qty)||1}× ${esc(i.name)}`).join(', ')}</div>
      <div class="top" style="margin-top:12px"><span class="title-s">${money(o.total)}</span>${isActiveOrder(o)?'<span class="live" style="color:var(--primary)"><i></i>LIVE</span>':`<button class="btn text" style="height:32px;margin-right:-8px" data-reorder="${esc(o.firestoreId||o.id)}"><span class="ms xs">replay</span>Order semula</button>`}</div>
    </div>`; };
  el.innerHTML=(active.length?`<div class="group-h"><div class="title-m">Sedang berjalan</div></div>${active.map(card).join('')}`:'')
    +(past.length?`<div class="group-h"><div class="title-m">Sejarah</div></div>${past.slice(0,20).map(card).join('')}`:'');
  el.querySelectorAll('[data-reorder]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); reorder(b.dataset.reorder); });
  el.querySelectorAll('[data-track]').forEach(b=>{
    b.onclick=()=>{ if(b.dataset.track) go('track/'+b.dataset.track); };
    b.onkeydown=e=>{ if(e.target===b&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); b.click(); } };
  });
}
function reorder(id){
  const o=S.orders.find(x=>(x.firestoreId||x.id)===id); if(!o) return;
  if(o.outletId && OUTLETS[o.outletId]) S.outlet=o.outletId;
  let added=0, skipped=0;
  (o.items||[]).forEach(i=>{
    const p=S.products.find(x=>x.id===i.id);
    if(!p||p.active===false||isSoldOut(p)){ skipped++; return; }
    const al=addonsFor(p).filter(a=>(i.extrasList||[]).includes(a.name));
    const key=lineKey(p.id,al.map(a=>a.id),i.note||''), ex=S.cart.find(l=>l.key===key);
    if(ex) ex.qty+=num(i.qty)||1;
    else S.cart.push({key,id:p.id,name:p.name,price:num(p.price),category:p.category||'',imageUrl:imgSrc(p).startsWith('data:')?'':imgSrc(p),qty:num(i.qty)||1,extras:al.reduce((s,a)=>s+a.price,0),extrasList:al.map(a=>a.name),note:i.note||''});
    added++;
  });
  if(orderMode(o)==='delivery' && deliveryEnabled()) S.mode='delivery';
  persist();
  if(added){ go('cart'); snack(skipped?`${skipped} item tidak tersedia dilangkau`:'Item ditambah ke troli'); }
  else snack('Item dalam order ini tidak tersedia sekarang.');
}

/* ---------- Track ---------- */
function renderTrack(){
  const el=$('#trackBody'), o=S.orders.find(x=>x.firestoreId===S.trackId);
  if(!o){ el.innerHTML=`<div class="empty"><span class="spin" style="color:var(--primary);width:32px;height:32px"></span><div class="body-m muted" style="margin-top:12px">Memuatkan pesanan…</div></div>`; return; }
  const m=orderMode(o), flow=STATUS_FLOW[m], s=o.status||'new';
  let idx=FINAL.includes(s)?flow.length-1:flow.findIndex(f=>f[0]===s); if(idx<0) idx=0;
  const cancelled=s==='cancelled', done=!cancelled&&idx===flow.length-1;
  const cr=STATUS_COPY[s]||STATUS_COPY.new, copy=Array.isArray(cr)?cr:cr[m];
  const oi=outletInfo(o.outletId), t=tsMs(o), eta=num(o.etaMinutes);
  const etaTxt = o.pickupTime ? `Masa ambil ${label12(toMin(o.pickupTime))}` : (eta&&t?`Anggaran siap ${fmtTime(t+eta*60000)}`:'');
  const cls=cancelled?'cancelled':(s==='ready'||done)?'ready':'';
  el.innerHTML=`
    <div class="track-hero ${cls}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="label-m" style="opacity:.75">NO. ORDER</span>${!done&&!cancelled?'<span class="live"><i></i>LIVE</span>':''}
      </div>
      <div class="num">#${esc(o.id)}</div>
      <div class="title-l" style="margin-top:14px">${esc(copy[0])}</div>
      <div class="body-m" style="opacity:.8;margin-top:2px">${esc(copy[1])}</div>
      ${etaTxt&&!done&&!cancelled?`<div class="body-m" style="margin-top:12px;display:flex;align-items:center;gap:6px;opacity:.9"><span class="ms sm">schedule</span>${esc(etaTxt)}</div>`:''}
      ${cancelled?'':`<div class="progress">${flow.map((f,i)=>`<i class="${i<idx||done?'on':''} ${i===idx&&!done?'cur':''}"></i>`).join('')}</div>`}
    </div>

    ${cancelled?'':`<div class="group"><div class="vsteps">
      ${flow.map((f,i)=>`<div class="vstep ${i<idx||done?'done':''} ${i===idx&&!done?'current':''}">
        <span class="dot">${i<idx||done?'<span class="ms">check</span>':''}</span>
        <div><div class="${i===idx?'title-s':'body-m'}" style="${i>idx?'color:var(--on-surface-variant)':''}">${esc(f[1])}</div>${i===0&&t?`<div class="body-s muted">${fmtTime(t)}</div>`:''}</div>
      </div>`).join('')}
    </div></div>`}

    <div class="group">
      <div class="tile"><span class="lead red"><span class="ms sm">${m==='delivery'?'two_wheeler':'storefront'}</span></span>
        <div class="mid"><div class="title-s">${m==='delivery'?'Delivery COD':'Pickup'} · ${esc(oi?.short||'')}</div>
        <div class="body-s muted">${m==='delivery'?esc(o.deliveryAddress||''):esc(oi?.address||'')}</div></div>
        ${m==='pickup'&&oi?`<a class="icon-btn ink" aria-label="Arah ke outlet" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('Ayenas '+oi.address)}"><span class="ms">directions</span></a>`:''}</div>
      <div class="hr"></div>
      <div class="tile"><span class="lead ok"><span class="ms sm">${m==='delivery'?'payments':'point_of_sale'}</span></span>
        <div class="mid"><div class="title-s">${m==='delivery'?'Tunai semasa terima':'Bayar di kaunter'}</div>
        <div class="body-s muted">${o.paymentStatus==='paid'?'Sudah dibayar ✓':`Perlu dibayar ${money(o.total)}`}</div></div></div>
    </div>

    <div class="group-h"><div class="title-m">Ringkasan</div></div>
    <div class="group"><div class="group-pad">
      ${(o.items||[]).map(i=>`<div class="sumrow" style="align-items:flex-start"><span><b>${num(i.qty)||1}×</b> ${esc(i.name)}${i.extrasList?.length?`<br><span class="body-s muted">+ ${esc(i.extrasList.join(', '))}</span>`:''}${i.note?`<br><span class="body-s muted" style="font-style:italic">“${esc(i.note)}”</span>`:''}</span><span>${money((num(i.price)+num(i.extras))*(num(i.qty)||1))}</span></div>`).join('')}
      ${num(o.deliveryFee)?`<div class="sumrow"><span class="muted">Caj penghantaran</span><span>${money(o.deliveryFee)}</span></div>`:''}
      <div class="sumrow total"><span>Jumlah</span><span>${money(o.total)}</span></div>
    </div></div>

    <div style="padding:8px 16px 24px;display:grid;gap:12px">
      ${oi?.phone&&!done?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <a class="btn tonal lg" href="tel:+${esc(oi.phone)}"><span class="ms">call</span>Telefon</a>
        <a class="btn tonal lg" target="_blank" rel="noopener" href="${esc(waLink(oi.phone,`Hai Ayenas, saya nak tanya tentang order #${o.id}`))}"><span class="ms">chat</span>WhatsApp</a></div>`:''}
      ${done||cancelled?`<button class="btn filled lg block" id="trReorder"><span class="ms">replay</span>Order semula</button>`:''}
      <button class="btn outlined lg block" id="trMenu">Kembali ke menu</button>
    </div>`;
  $('#trMenu').onclick=()=>go('menu');
  $('#trReorder') && ($('#trReorder').onclick=()=>reorder(o.firestoreId));
}

/* ---------- Account ---------- */
function renderProfile(){
  const P=S.profile, ok=S.orders.filter(o=>o.status!=='cancelled'), spend=ok.reduce((s,o)=>s+num(o.total),0);
  const oi=outletInfo(S.outlet), today=new Date().getDay();
  $('#profileBody').innerHTML=`
    <div style="display:flex;align-items:center;gap:16px;padding:8px 20px 20px">
      <div style="width:64px;height:64px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:26px;font-weight:750;flex:none">${esc((P.name||'A').trim().charAt(0).toUpperCase())}</div>
      <div style="min-width:0"><div class="title-l ellipsis">${esc(P.name||'Pelanggan Ayenas')}</div><div class="body-m muted">${P.phone?esc(normPhone(P.phone)):'Tambah nombor telefon di bawah'}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 8px">
      <div class="group" style="margin:0"><div class="group-pad"><div class="body-s muted">Jumlah order</div><div class="headline-s">${ok.length}</div></div></div>
      <div class="group" style="margin:0"><div class="group-pad"><div class="body-s muted">Jumlah belanja</div><div class="headline-s">${money(spend)}</div></div></div>
    </div>

    <div class="group-h"><div class="title-m">Maklumat tersimpan</div><span class="body-s" style="color:var(--success)" id="pfSaved"></span></div>
    <div class="group"><div class="group-pad" style="padding-bottom:2px">
      <div class="field"><input id="pfName" placeholder=" " maxlength="60" autocomplete="name" value="${esc(P.name)}"><label for="pfName">Nama</label></div>
      <div class="field has-prefix"><input id="pfPhone" type="tel" inputmode="tel" placeholder=" " maxlength="14" autocomplete="tel" value="${esc(P.phone)}"><label for="pfPhone">No. telefon</label><span class="prefix">+6</span></div>
      <div class="field"><textarea id="pfAddr" placeholder=" " rows="2" maxlength="300" autocomplete="street-address">${esc(P.address)}</textarea><label for="pfAddr">Alamat delivery</label></div>
    </div></div>

    ${oi?`<div class="group-h"><div class="title-m">Outlet anda</div><button class="btn text" id="pfOutlet" style="margin-right:-12px">Tukar</button></div>
    <div class="group">
      <div class="tile"><span class="lead red"><span class="ms sm">storefront</span></span><div class="mid"><div class="title-s">${esc(oi.name)}</div><div class="body-s muted">${esc(oi.address)}</div></div></div>
      <div class="hr"></div>
      <div class="group-pad">
        ${oi.hours.map((h,i)=>`<div class="sumrow" style="${i===today?'font-weight:700':'color:var(--on-surface-variant)'}"><span>${DAYS[i]}${i===today?' · hari ini':''}</span><span>${h?`${label12(toMin(h[0]))} – ${label12(toMin(h[1]))}`:'Tutup'}</span></div>`).join('')}
      </div>
      <div class="hr"></div>
      <div style="display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap">
        <a class="btn outlined" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('Ayenas '+oi.address)}"><span class="ms sm">directions</span>Arah</a>
        ${oi.phone?`<a class="btn outlined" href="tel:+${esc(oi.phone)}"><span class="ms sm">call</span>Telefon</a><a class="btn outlined" target="_blank" rel="noopener" href="${esc(waLink(oi.phone))}"><span class="ms sm">chat</span>WhatsApp</a>`:''}
      </div>
    </div>`:''}

    <div class="group" ${installEvt?'':'hidden'} style="margin-top:12px">
      <button class="tile ink" id="pfInstall"><span class="lead red"><span class="ms sm">install_mobile</span></span><span class="mid"><span class="title-s">Pasang app Ayenas</span><br><span class="body-s muted">Buka terus dari skrin utama telefon</span></span><span class="ms muted">chevron_right</span></button>
    </div>
    <p class="body-s muted" style="text-align:center;padding:20px">Ayenas · v13</p>`;
  const sv=()=>{ S.profile.name=$('#pfName').value.trim(); S.profile.phone=$('#pfPhone').value.trim(); S.profile.address=$('#pfAddr').value.trim(); persist(); $('#pfSaved').textContent='✓ Disimpan'; setTimeout(()=>{ const x=$('#pfSaved'); if(x) x.textContent=''; },1800); };
  ['#pfName','#pfPhone','#pfAddr'].forEach(s=>$(s).addEventListener('change',sv));
  $('#pfOutlet') && ($('#pfOutlet').onclick=()=>showGate(true));
  $('#pfInstall').onclick=async()=>{ if(!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt=null; renderProfile(); };
}

/* ---------- Outlet gate ---------- */
function showGate(dismissable){
  const g=$('#gate');
  $('#gateOutlets').innerHTML=Object.keys(OUTLETS).map(id=>{
    const o=outletInfo(id), st=outletStatus(id), hs=hoursState(id), cls=st==='closed'||!hs.open?'closed':st;
    return `<button class="outlet-card ink" data-outlet="${id}" role="radio" aria-checked="${id===S.outlet}">
      <span class="pin"><span class="ms">storefront</span></span>
      <span style="flex:1;min-width:0"><span class="title-m">${esc(o.name)}</span><br><span class="body-s muted">${esc(o.address)}</span><br>
      <span class="body-s" style="display:inline-flex;align-items:center;margin-top:6px"><span class="sdot ${cls}"></span>${st==='closed'?'Tutup sekarang':esc(hs.text||'Buka')}</span></span>
      <span class="ms muted">${id===S.outlet?'check_circle':'chevron_right'}</span></button>`;
  }).join('')+(dismissable&&S.outlet?`<div style="text-align:center;margin-top:8px"><button class="btn text" id="gateCancel">Batal</button></div>`:'');
  $$('#gateOutlets [data-outlet]').forEach(b=>b.onclick=()=>chooseOutlet(b.dataset.outlet));
  $('#gateCancel') && ($('#gateCancel').onclick=()=>g.classList.remove('show'));
  g.classList.add('show'); g.scrollTop=0;
}
function chooseOutlet(id){
  const changed=S.outlet&&S.outlet!==id;
  S.outlet=id; persist(); $('#gate').classList.remove('show'); vibrate(10); render();
  if(changed){ const so=S.cart.filter(l=>{ const p=S.products.find(x=>x.id===l.id); return p&&isSoldOut(p); }); snack(so.length?`Outlet ditukar. ${so.length} item dalam troli habis di sini.`:`Outlet ditukar ke ${OUTLETS[id].short}`); }
}

/* ---------- PWA ---------- */
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; });
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./service-worker.js').catch(()=>{});

/* =========================================================
   BOOT
   ========================================================= */
const hideSplash=()=>$('#splash').classList.add('hide');
setTimeout(hideSplash,2500);
go(location.hash.replace(/^#\//,'')||'menu',{replace:true});
setTimeout(()=>{ hideSplash(); if(!S.outlet) showGate(false); },600);

/* =========================================================
   FIREBASE
   ========================================================= */
(async()=>{
  try{
    const [{initializeApp},{getAuth,signInAnonymously,onAuthStateChanged},fs]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-auth.js'),import(FB+'firebase-firestore.js')]);
    const {getFirestore,collection,doc,setDoc,addDoc,onSnapshot,query,where,serverTimestamp,increment}=fs;
    const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
    const ensureUser=async()=>auth.currentUser||(await signInAnonymously(auth)).user;

    S.fb={ async createOrder(order){
      const user=await ensureUser();
      const ref=await addDoc(collection(db,'orders'),{...order,customerUid:user.uid,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
      setDoc(doc(db,'customers',user.uid),{
        name:order.name, phone:order.phone, phoneDigits:order.phone.replace(/\D/g,''),
        lastOutletId:order.outletId, lastOrderType:order.orderType,
        ...(order.deliveryAddress?{lastAddress:order.deliveryAddress}:{}),
        lastOrderAt:serverTimestamp(), updatedAt:serverTimestamp(),
        orderCount:increment(1), totalSpend:increment(Number(order.total||0))
      },{merge:true}).catch(e=>console.warn('customer profile',e));
      return ref;
    }};

    onSnapshot(collection(db,'products'),snap=>{
      if(snap.empty) return;
      S.products=snap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.active!==false).sort((a,b)=>num(a.sort)-num(b.sort));
      S.cart.forEach(l=>{ const p=S.products.find(x=>x.id===l.id); if(p){ l.price=num(p.price); l.name=p.name; } });
      persist(); if($('#sheet').classList.contains('show')||S.view==='cart') renderChrome(); else render();
    },e=>console.warn('menu',e));

    onSnapshot(collection(db,'outletSettings'),snap=>{
      S.settings={}; snap.docs.forEach(d=>S.settings[d.id]=d.data());
      if(S.view==='cart') renderChrome(); else render();
      if($('#gate').classList.contains('show')) showGate(!!S.outlet);
    },e=>console.warn('outletSettings',e));

    let unsub=null; const prev={};
    onAuthStateChanged(auth,user=>{
      if(!user){ signInAnonymously(auth).catch(e=>console.warn('Enable Anonymous Auth',e)); return; }
      unsub?.();
      unsub=onSnapshot(query(collection(db,'orders'),where('customerUid','==',user.uid)),snap=>{
        const remote=snap.docs.map(d=>({firestoreId:d.id,...d.data()})).sort((a,b)=>tsMs(b)-tsMs(a));
        remote.forEach(o=>{
          const p=prev[o.firestoreId];
          if(p && p!==o.status){
            vibrate([40,60,40]);
            const c=STATUS_COPY[o.status], t=Array.isArray(c)?c[0]:c?.[orderMode(o)]?.[0];
            if(t && !(S.view==='track'&&S.trackId===o.firestoreId)) snack(`#${o.id}: ${t}`,{label:'LIHAT',fn:()=>go('track/'+o.firestoreId)});
          }
          prev[o.firestoreId]=o.status;
        });
        S.orders=remote;
        store.set('ay_orders',remote.slice(0,30).map(o=>({...o,createdAt:o.createdAt?{seconds:o.createdAt.seconds}:null,updatedAt:null})));
        if(['orders','track','profile'].includes(S.view)) render(); else renderChrome();
      },e=>console.warn('orders',e));
    });
  }catch(e){
    console.error('Firebase gagal dimuatkan',e);
    snack('Mod luar talian — menu mungkin tidak terkini.');
  }
})();
</script>
</body>
</html>
