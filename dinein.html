<style>
:root{--red:#F20D12;--black:#111111;--cream:#FFF8F1;--yellow:#FFC928;--orange:#FF6A13;--muted:#746E68;--line:#E9E2DA;--white:#fff;}
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3eee8;color:var(--black)}
button,input,textarea,select{font:inherit} button{cursor:pointer}
.app{max-width:480px;margin:auto;min-height:100vh;background:var(--cream);box-shadow:0 0 40px #00000018;position:relative;padding-bottom:82px}
.top{background:linear-gradient(135deg,#ef1118,#d90005);padding:18px 18px 24px;color:#fff;border-radius:0 0 28px 28px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px} .logo{width:132px;height:64px;object-fit:contain;filter:drop-shadow(0 3px 5px #0004)}
.iconbtn{width:42px;height:42px;border:0;border-radius:50%;background:#fff;color:#111;font-size:20px}
.greet{margin-top:8px;font-weight:800;font-size:19px} .points{font-size:13px;color:#ffe27a;margin-top:2px;font-weight:800}
.mode{background:#fff;margin:-14px 16px 0;border-radius:18px;padding:7px;display:grid;grid-template-columns:1fr 1fr;gap:7px;box-shadow:0 10px 25px #00000012;position:relative;z-index:2}
.mode button{border:0;border-radius:13px;padding:13px 8px;background:#f7f4f0;font-weight:900;color:#1b1b1b} .mode button.active{background:var(--red);color:white}
.content{padding:16px} .outlet{border:1px solid var(--line);border-radius:15px;background:#fff;padding:13px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.outlet small{color:#34833d;font-weight:700} .hero{height:220px;border-radius:20px;background-size:cover;background-position:center;position:relative;overflow:hidden;margin-bottom:22px}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000d 0%,#0008 48%,transparent 80%)}
.heroText{position:absolute;z-index:2;color:white;left:18px;top:21px;width:58%} .heroText .big{font-size:33px;font-weight:1000;line-height:.93;text-transform:uppercase}
.heroText .big span{color:#ff2b2f} .heroText p{font-size:13px} .cta{background:var(--yellow);border:0;border-radius:10px;padding:11px 14px;font-weight:900}
.sectionHead{display:flex;align-items:end;justify-content:space-between;margin:18px 0 11px} .sectionHead h3{margin:0;font-size:16px} .link{border:0;background:none;color:var(--red);font-weight:800;font-size:12px}
.chips{display:flex;gap:9px;overflow:auto;padding-bottom:4px;scrollbar-width:none} .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;white-space:nowrap;font-size:12px;font-weight:800}
.chip.active{background:#111;color:#fff;border-color:#111}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px} .card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;position:relative}
.card img{width:100%;height:126px;object-fit:cover;display:block} .cardbody{padding:10px} .badge{position:absolute;top:8px;left:8px;background:var(--red);color:white;font-size:9px;font-weight:1000;padding:5px 7px;border-radius:999px}
.name{font-weight:900;font-size:13px;line-height:1.2;min-height:32px} .desc{font-size:10px;color:var(--muted);line-height:1.35;min-height:28px;margin-top:4px} .priceRow{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.price{font-weight:1000} .add{border:0;background:var(--red);color:white;width:32px;height:32px;border-radius:9px;font-size:21px;line-height:1}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
.bottom button{border:0;background:none;color:#777;font-size:10px;padding:5px} .bottom b{display:block;font-size:19px;line-height:1.2} .bottom button.active{color:var(--red)}
.sheetWrap{position:fixed;inset:0;background:#0008;z-index:50;display:none;align-items:flex-end;justify-content:center} .sheetWrap.show{display:flex}
.sheet{width:min(480px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0} .sheetHero{height:270px;background-size:cover;background-position:center;position:relative}
.close{position:absolute;top:14px;left:14px;border:0;background:#111b;color:white;width:40px;height:40px;border-radius:50%;font-size:20px}
.sheetBody{padding:18px 18px 110px} .sheetBody h2{margin:4px 0 6px;font-size:23px} .sheetBody p{color:#5f5b57;font-size:13px;line-height:1.45}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 18px} .opt{border:1px solid var(--line);border-radius:13px;padding:11px;text-align:center;background:#fff} .opt.active{border-color:var(--red);background:#fff2f2;color:var(--red)}
.extra{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f1ece7;font-size:13px} textarea,input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.sticky{position:sticky;bottom:0;background:#111;color:white;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px} .sticky button{background:var(--red);color:white;border:0;border-radius:12px;padding:14px 18px;font-weight:900;flex:1}
.page{display:none} .page.active{display:block} .simpleTop{padding:17px;background:#fff;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5} .simpleTop h2{font-size:17px;margin:0}
.listCard{display:flex;gap:11px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:9px;margin-bottom:10px} .listCard img{width:104px;height:104px;border-radius:12px;object-fit:cover} .listCard .grow{flex:1}
.qty{display:flex;gap:9px;align-items:center} .qty button{border:1px solid var(--line);background:#fff;width:30px;height:30px;border-radius:8px}
.totalBox{background:#fff;border-top:1px solid var(--line);padding:15px;margin-top:16px} .row{display:flex;justify-content:space-between;margin:8px 0;font-size:13px} .row.total{font-size:19px;font-weight:1000;padding-top:10px;border-top:1px solid var(--line)}
.primary{width:100%;background:var(--red);color:#fff;border:0;border-radius:14px;padding:15px;font-weight:1000} .choicegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px} .choice{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff} .choice.active{border:2px solid var(--red)} .label{font-size:11px;font-weight:900;margin:14px 0 6px;text-transform:uppercase}
.orderStatus{padding:20px} .timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:26px 0} .step{text-align:center;font-size:10px;color:#999;position:relative} .step:before{content:"";display:block;margin:auto;width:18px;height:18px;border-radius:50%;background:#ddd;position:relative;z-index:2} .step.done:before{background:#34a853} .step:after{content:"";position:absolute;height:3px;background:#ddd;width:100%;top:8px;left:-50%} .step:first-child:after{display:none} .step.done:after{background:#34a853}
.rewardCard{margin:16px;background:linear-gradient(135deg,#111,#2a2a2a);color:white;border-radius:18px;padding:20px;position:relative;overflow:hidden} .rewardCard:after{content:"AYENAS";position:absolute;right:-13px;bottom:-16px;font-weight:1000;font-size:70px;color:#ffffff08} .rewardPts{font-size:34px;font-weight:1000;color:var(--yellow)}
.rewards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px} .reward{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;font-size:11px}
.empty{padding:50px 20px;text-align:center;color:#777}
@media(min-width:800px){body{padding:24px 0} .app{border-radius:26px;overflow:hidden;min-height:900px} .bottom{border-radius:0 0 26px 26px}}

#splash{
  position:fixed; inset:0; z-index:9999;
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(circle at 68% 35%, rgba(255,201,40,.18), transparent 28%),
    linear-gradient(145deg,#F20D12 0%,#D90005 48%,#111 120%);
  overflow:hidden;
}
#splash::before{
  content:""; position:absolute; inset:-20%;
  background:
    repeating-linear-gradient(155deg,transparent 0 22px,rgba(255,255,255,.035) 22px 24px);
  transform:rotate(-3deg);
}
.splash-inner{position:relative;text-align:center;color:#fff;padding:24px}
.splash-badge{
  width:184px;height:184px;margin:auto;border-radius:50%;
  background:#fff;display:grid;place-items:center;
  box-shadow:0 24px 55px rgba(0,0,0,.35),0 0 0 8px rgba(255,255,255,.12);
  animation:splashPop .9s cubic-bezier(.2,.85,.25,1.25) both;
}
.splash-badge img{width:92%;height:92%;object-fit:contain;border-radius:50%}
.splash-title{
  margin-top:24px;font-size:28px;font-weight:1000;letter-spacing:.5px;
  transform:skew(-7deg); animation:fadeUp .7s .45s both;
}
.splash-title span{color:#FFC928}
.splash-sub{margin-top:7px;font-size:12px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;opacity:.9;animation:fadeUp .7s .65s both}
.splash-loader{width:132px;height:4px;background:#ffffff2e;border-radius:999px;margin:25px auto 0;overflow:hidden;animation:fadeUp .7s .8s both}
.splash-loader i{display:block;height:100%;width:0;background:#FFC928;border-radius:999px;animation:loadBar 2.35s .65s ease forwards}
#splash.hide{animation:splashOut .55s ease forwards;pointer-events:none}
@keyframes splashPop{0%{opacity:0;transform:scale(.55) rotate(-9deg)}70%{opacity:1;transform:scale(1.06) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes loadBar{to{width:100%}}
@keyframes splashOut{to{opacity:0;visibility:hidden;transform:scale(1.035)}}
@media (prefers-reduced-motion: reduce){
  .splash-badge,.splash-title,.splash-sub,.splash-loader,.splash-loader i{animation:none!important}
}

  background-position:center 62%;
  filter:saturate(1.06) contrast(1.06);
  box-shadow:none;
}
.logoBanner .bannerArt::before{display:none}
.logoLockup{
  position:relative;
  z-index:3;
  width:55%;
  padding:25px 0 0 18px;
}
.logoLockup img{
  width:150px;
  height:150px;
  object-fit:contain;
  border-radius:50%;
  filter:drop-shadow(0 12px 18px rgba(0,0,0,.28));
}
.logoTagline{
  margin-top:-6px;
  margin-left:15px;
  font-size:15px;
  font-weight:1000;
  letter-spacing:.5px;
  color:#fff;
}
.logoTagline span{color:#FFC928}
.logoBanner .pointsBadge{
  top:21px;
  right:14px;
}


/* ===== V5 LIVE ORDER TRACKING ===== */
.trackHero{
  text-align:center;
  padding:8px 0 4px;
}
.trackIcon{
  width:74px;height:74px;margin:auto;border-radius:24px;
  display:grid;place-items:center;font-size:38px;
  background:#fff0f0;
}
.trackHero h2{margin:13px 0 5px;font-size:22px}
.trackHero p{margin:0;color:#746E68;font-size:13px;line-height:1.45}
.trackOrderMeta{
  display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0;
}
.trackMetaCard{
  background:#fff;border:1px solid #E9E2DA;border-radius:14px;padding:12px;
}
.trackMetaCard small{display:block;color:#746E68;font-size:10px;margin-bottom:3px}
.trackMetaCard b{font-size:13px}
.liveBadge{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 9px;border-radius:999px;background:#edf7ee;color:#287536;
  font-size:10px;font-weight:900;margin-top:10px;
}
.liveDot{
  width:7px;height:7px;border-radius:50%;background:#2b8a3e;
  box-shadow:0 0 0 4px rgba(43,138,62,.12);
  animation:pulseDot 1.4s infinite;
}
@keyframes pulseDot{50%{box-shadow:0 0 0 8px rgba(43,138,62,0)}}
.orderItemsBox{
  background:#fff;border:1px solid #E9E2DA;border-radius:16px;padding:13px;margin-top:12px;
}
.orderItemsBox .row{margin:7px 0}
.statusHelp{
  margin-top:12px;padding:11px 12px;border-radius:12px;
  background:#fff7db;color:#6f5700;font-size:11px;line-height:1.45;
}


/* V7 dine-in + delivery */
.serviceGate{position:fixed;inset:0;z-index:10002;background:rgba(10,8,8,.78);display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(8px)}
.serviceGate.show{display:flex}.serviceCard{width:min(430px,100%);background:#fff;border-radius:24px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.serviceChoices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.serviceChoice{border:1px solid #e8e0d8;border-radius:17px;padding:17px 12px;background:#fff;text-align:left}
.serviceChoice b{display:block;margin-top:7px}.serviceChoice small{display:block;color:#746E68;margin-top:4px;line-height:1.35}.serviceChoice .ico{font-size:28px}
.v7box{background:#f8f5f2;border-radius:14px;padding:12px;margin-top:10px}.v7hidden{display:none!important}
.v7choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}.v7choice button{border:1px solid #e4ddd6;background:#fff;border-radius:12px;padding:11px;font-weight:800}
.v7choice button.active{border:2px solid #f20d12;background:#fff4f4}.v7loc{font-size:11px;color:#6f6964;margin-top:7px;word-break:break-word}
.tableInput{font-size:18px!important;font-weight:900!important;text-align:center!important}

/* V8 operational states */
.outletStateBar{margin:10px 0;padding:10px 12px;border-radius:13px;font-size:11px;font-weight:800;background:#edf7ee;color:#287536}
.outletStateBar.busy{background:#fff7db;color:#725900}.outletStateBar.closed{background:#fff0f0;color:#b32121}
.soldOutMask{opacity:.52;filter:grayscale(.15)}.soldOutBadge{display:inline-block;padding:4px 7px;border-radius:999px;background:#111;color:#fff;font-size:9px;font-weight:900}
.etaCard{background:#fff7db;color:#6f5700;padding:10px 12px;border-radius:12px;margin-top:10px;font-size:11px}

/* V11 Dine-In additions: all other visuals come directly from index.html */
.v11TableGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;margin-top:10px}
.v11TableBtn{min-height:52px;border:1px solid #e8e1db;background:#fff;border-radius:14px;font-weight:1000;font-size:14px}
.v11TableBtn.active{background:#F20D12!important;color:#fff!important;border-color:#F20D12!important;box-shadow:0 8px 22px rgba(242,13,18,.22)}
.v11TableGate{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:9999;display:flex;align-items:flex-end;justify-content:center}
.v11TableCard{width:min(100%,520px);background:#fff;border-radius:24px 24px 0 0;padding:20px}
.v11TableCard>b{font-size:20px;display:block}.v11TableCard>small{display:block;color:#777;margin-top:4px}
.v11TablePill{display:inline-flex;align-items:center;background:#111;color:#fff;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:1000;margin-left:7px}
</style>
</head>

async function placeOrder(){
 const _setting=outletSettings[selectedOutlet]||{};
 if((_setting.status||'open')==='closed') return toast('Outlet sedang tutup. Order baru tidak diterima.');

 let address=null, deliveryContact=null;

 }

 const total=subtotal();
 let order={
   id:'AY'+Date.now().toString().slice(-7),

   name,phone,
   mode:'dinein',
   tableNumber:dineTable,
   orderType:'dinein',

   total,
   items:[...cart],
   status:'new',

   deliveryAddress:null,

   deliveryLocation:null,
   paymentMethod:'counter',
   paymentStatus:'unpaid'
 };

 try{
   if(window.ayenasCreateOrder){
     const remote=await window.ayenasCreateOrder(order);
     if(remote?.id)order.firestoreId=remote.id;
   }
 }catch(err){
   console.error(err);
   return toast('Order gagal dihantar. Cuba lagi.');
 }

 orders.unshift(order);
 cart=[];
 save();

 if(false){
   const map=`https://maps.google.com/?q=${deliveryLocation.lat},${deliveryLocation.lng}`;
   const itemText=order.items.map(i=>`${i.qty||1}x ${i.name}`).join(', ');
   const msg=`AYENAS ORDER ${order.id}
Nama: ${name}
Telefon: ${deliveryContact}
Order: ${itemText}
Jumlah: ${money(total)}
Alamat: ${address}
Lokasi: ${map}

Saya nak buat payment untuk order ini.`;
   navigator.clipboard?.writeText(msg);

 }else{
   toast(orderMode==='pickup'

 }
 showPage('orders');
}

<script>
/* V11.2 startup fail-safe: splash must never trap the customer */
(function(){
  function dismissSplash(){
    var ids=['splash','splashScreen','appSplash','loadingScreen'];
    ids.forEach(function(id){
      var el=document.getElementById(id);
      if(el){ el.classList.remove('show','active'); el.style.opacity='0'; el.style.pointerEvents='none';
        setTimeout(function(){el.style.display='none'},250); }
    });
    document.querySelectorAll('.splash,.splash-screen,.splashScreen,.loading-screen').forEach(function(el){
      el.classList.remove('show','active'); el.style.opacity='0'; el.style.pointerEvents='none';
      setTimeout(function(){el.style.display='none'},250);
    });
  }
  window.__dismissAyenasSplash=dismissSplash;
  window.addEventListener('DOMContentLoaded',function(){ setTimeout(dismissSplash,900); });
  window.addEventListener('load',function(){ setTimeout(dismissSplash,350); });
  setTimeout(dismissSplash,1800);
})();
</script>

const firebaseConfig = {"apiKey": "AIzaSyAQdk3ZfMnIGyr7k2UD1HDc3UQWWbxSFFw", "authDomain": "ayenas-1dcd9.firebaseapp.com", "projectId": "ayenas-1dcd9", "storageBucket": "ayenas-1dcd9.firebasestorage.app", "messagingSenderId": "503075108633", "appId": "1:503075108633:web:0a8e912f634dbfbadeb788"};
const APP = 'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';
const AUTH = 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
const FS = 'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';

const { initializeApp } = await import(APP);
const { getAuth, signInAnonymously, onAuthStateChanged } = await import(AUTH);
const {
  getFirestore, collection, doc, setDoc, addDoc, onSnapshot, query, where,
  serverTimestamp, increment, updateDoc
} = await import(FS);

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let customerUid = null;

async function ensureAnonymous(){
  if(auth.currentUser) return auth.currentUser;
  try {
    const cred = await signInAnonymously(auth);
    return cred.user;
  } catch (e) {
    console.error('Enable Anonymous Auth in Firebase Authentication.', e);
    throw e;
  }
}

window.ayenasCreateOrder = async function(order){
  const user = await ensureAnonymous();
  customerUid = user.uid;
  const ref = await addDoc(collection(db,'orders'), {
    ...order,
    customerUid:user.uid,
    createdAt:serverTimestamp(),
    updatedAt:serverTimestamp()
  });
  const digits = (order.phone||'').replace(/\D/g,'');
  await setDoc(doc(db,'customers',user.uid), {
    name:order.name,
    phone:order.phone,
    phoneDigits:digits,
    lastOutletId:order.outletId,
    lastOrderAt:serverTimestamp(),
    updatedAt:serverTimestamp(),
    orderCount:increment(1),
    totalSpend:increment(Number(order.total||0)),
    points:increment(Number(order.earned||0))
  }, {merge:true});
  return {id:ref.id};
};

  onSnapshot(collection(db,'products'), snap=>{
    if(snap.empty) return;
    products = snap.docs.map(d=>{
      const x=d.data();
      return {
        id:d.id,
        ...x,
        image:x.imageUrl||x.image||'nasi.jpg'
      };
    }).filter(x=>x.active!==false);
    renderHome();
    renderMenu();
  }, err=>console.warn('Menu live unavailable',err));
}


async function listenCustomerProfile(){
  const user=await ensureAnonymous();
  onSnapshot(doc(db,'customers',user.uid),snap=>{
    if(!snap.exists()) return;
    const data=snap.data();
    if(Number.isFinite(Number(data.points))){

      localStorage.setItem('ayenas_points',points);
      renderRewards();
    }
  },err=>console.warn('Customer profile listener unavailable',err));
}


let outletSettings={};

  onSnapshot(collection(db,'outletSettings'),snap=>{

  },e=>console.warn('Outlet settings listener',e));

}

  const sold=p.soldOutByOutlet||{};
  return !sold[selectedOutlet] && p.active!==false;
}
async function listenMyOrders(){
  const user = await ensureAnonymous();
  customerUid=user.uid;
  const q=query(collection(db,'orders'),where('customerUid','==',user.uid));
  onSnapshot(q,snap=>{
    const remote=snap.docs.map(d=>({firestoreId:d.id,...d.data()}));
    if(!remote.length) return;
    remote.sort((a,b)=>{
      const at=a.createdAt?.seconds||0, bt=b.createdAt?.seconds||0;
      return bt-at;
    });
    orders=remote;
    localStorage.setItem('ayenas_orders',JSON.stringify(orders));
    if(document.getElementById('orders')?.classList.contains('active')) renderOrders();
  }, err=>console.warn('Order listener unavailable',err));
}

onAuthStateChanged(auth, ()=>{ listenMenu(); listenMyOrders(); listenCustomerProfile(); listenOutletSettings(); });
ensureAnonymous().catch(()=>{});
